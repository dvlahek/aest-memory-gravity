name: GE19 H4F3d12r1 Restricted Background and Archived Actual-D11 Static Audit

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/h4f3d12*'
      - 'docs/ge19_h4f3d12*'
      - '.github/workflows/ge19-h4f3d12r1-restricted-background-static.yml'

jobs:
  exact-source-and-archived-multiplier:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic symbolic audit dependencies
        run: python3 -m pip install numpy sympy
      - name: Check frozen code, original action provenance, gzip integrity and exact restricted symbolic gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ge19/h4f3d12_predata_restricted_background_and_f21_bound.json)" = "97b513c176f9de6e1ee55cc21d87cb23103fc707"
          test "$(git rev-parse HEAD:ge19/h4f3d12_restricted_background_and_conditional_f21_bound.py)" = "d5f3184f069738679ce7fe738836ef712f60b867"
          test "$(git rev-parse HEAD:ge19/h4f3d12r1_restricted_background_and_conditional_f21_bound.py)" = "794df05d6c2c7572a435ba617b0c22649a28b318"
          test "$(git rev-parse HEAD:ge19/h4f3d12_freeze_manifest.json)" = "b7b8a97ea9e27e6f31a85e7724532bb4dfc4fc4b"
          test "$(git rev-parse HEAD:docs/ge19_h4f3d12_restricted_background_freeze_report.md)" = "ec2a6ab2758777d6373623dd2d869a206080e84c"
          test "$(git rev-parse HEAD:ge19/h4f3d12_actual_d11_conditional_f21_bound.json.gz)" = "30cae15e4c2992484d96d3ba0f3f02e8ea8969b1"
          test "$(git rev-parse HEAD:ge19/run_local_h4f3d12r1_restricted_background_and_f21_bound.sh)" = "857765404ad013175d69be91c0f3d8428f647228"
          bash -n ge19/run_local_h4f3d12r1_restricted_background_and_f21_bound.sh
          test "$(git rev-parse HEAD:ge19/h4f3d11_actual_original_background_e00_independent_archive_audit.json)" = "c3f238c2914ff18e43030ec31a3debb0edab81f1"
          test "$(git rev-parse HEAD:ge06/analytic_aest_directional_source_generator.py)" = "a7afe0035054a9dca55d74a6497c081422114b4c"
          test "$(git rev-parse HEAD:ge07/pressureless_matter_directional_source_generator.py)" = "cde8da77a80799cef00fc7c09c3633310fc9e3d4"
          python3 -B - <<'PY'
          import ast,gzip,hashlib,importlib.util,json,math
          from pathlib import Path
          import numpy as np
          pre=Path("ge19/h4f3d12_predata_restricted_background_and_f21_bound.json")
          r0=Path("ge19/h4f3d12_restricted_background_and_conditional_f21_bound.py")
          r1=Path("ge19/h4f3d12r1_restricted_background_and_conditional_f21_bound.py")
          manifest=Path("ge19/h4f3d12_freeze_manifest.json")
          blob=Path("ge19/h4f3d12_actual_d11_conditional_f21_bound.json.gz")
          digest=lambda b:hashlib.sha256(b).hexdigest()
          assert digest(pre.read_bytes())=="d704bd35c71f80133c7e5b3bb7b71423366f4a692be48fb5797526c2f31db183"
          assert digest(r0.read_bytes())=="61912f04c5504bd173c86e0b143156c756aec7200801d9e468c16edbc7e6edbb"
          assert digest(r1.read_bytes())=="cc637acbe41941247bdf0382dfd1d517790795ba5e7c1562482e0ac0ca757017"
          assert digest(manifest.read_bytes())=="e4a6030f85d1bfbe22c095c82ee572497de1c602e37d57c516373cf59be0bfea"
          assert digest(blob.read_bytes())=="7f011e1f56e1e44708d4515b3593e8ad2f65921ef2cac56bdc0871e867530ef0"
          raw=gzip.decompress(blob.read_bytes())
          assert digest(raw)=="5d94ac19e3176e8e6d2948260b957718eba9620ea9fced2981fe2e6df2c5837e"
          original=json.loads(raw)
          predata=json.loads(pre.read_text())
          freeze=json.loads(manifest.read_text())
          assert original["original_actual_F21_state_available"] is False
          assert original["full_original_GE05_bath_background_onshell_certified"] is False
          assert original["full_original_H4_Noether_certified"] is False
          assert original["Z21_certified"] is False
          assert original["lensing_licensed"] is False
          assert predata["frozen_parent_D11_json_sha256"]==original["original_actual_D11_json_sha256"]
          assert predata["frozen_parent_D11_npz_sha256"]==original["original_actual_D11_npz_sha256"]
          assert original["preregistered_sha256"]==digest(pre.read_bytes())
          assert freeze["actual_D11_derived_output"]["sha256"]==digest(raw)
          assert len(original["restricted_symbolic_exact_background_gates"])==23
          assert all(original["restricted_symbolic_exact_background_gates"].values())
          ast.parse(r1.read_text(),filename=str(r1))
          spec=importlib.util.spec_from_file_location("D12_r1",r1)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          live=mod.source_bound_analytic_proof()
          assert live==original["restricted_symbolic_exact_background_gates"]
          q=original["actual_original_D11_conditional_F21_norm_multiplier"]
          assert len(q["rows"])==12
          assert q["kfund_original"]==mod.KH0*mod.H0/100/mod.FOURIER_N0
          assert q["kmax_full_m64"]==64*q["kfund_original"]
          assert q["kmax_reduced_projection_m40"]==40*q["kfund_original"]
          for row in q["rows"]:
              assert row["Nt"] in (64,128) and row["C"] in mod.TAGS and row["scheme"] in mod.SCHEMES
              assert row["unknown_F21_L21_b21_NOT_assumed_zero"] is True
              inf=row["euler_actual_E00_abs_max_report_only"]
              assert set(inf)==set(mod.NAMES)
              for band in (40,64):
                  c=row["band_conditional_coefficients"][f"m0_to_{band}"]
                  k=band*q["kfund_original"]
                  assert c["kmax"]==k
                  want=k*math.sqrt(sum(inf[name]**2 for name in mod.NAMES))
                  assert math.isclose(c["joint_vector_operator_coefficient"],want,rel_tol=5e-15,abs_tol=1e-299)
                  assert c["background_boundary_L21_coefficient"]==inf["L"]
                  assert c["background_boundary_b21_coefficient"]==inf["b"]
                  assert c["original_F21_norm_available"] is False
          synthetic=mod.fft_negative_control(q["kfund_original"])
          want_syn=original["synthetic_periodic_fourier_negative_controls"]
          for key in synthetic:
              assert isinstance(synthetic[key],bool) or math.isclose(synthetic[key],want_syn[key],rel_tol=2e-14,abs_tol=1e-299)
          print("GE19_H4F3D12R1_FROZEN_ACTUAL_D11_MULTIPLIERS_AND_SYMBOLIC_STATIC_PASS_F21_OPEN")
          PY
