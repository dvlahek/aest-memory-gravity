name: v019k complex-frequency bath audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'v019k/**'
      - '.github/workflows/v019k-complex-bath-audit.yml'

jobs:
  bath-v019k:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath

      - name: Complex-frequency audit of current N16/N20 designs
        run: python v019k/01_complex_kernel_audit.py

      - name: Verify exact positive continuum identity on complex branch
        run: python v019k/02_spectral_identity.py

      - name: Time-domain driven-oscillator audit
        run: python v019k/03_time_domain_drive.py

      - name: Positive high-order quadrature scan
        run: python v019k/04_positive_quadrature_scan.py

      - name: Create v0.19k master report
        run: python v019k/05_make_report.py

      - name: Upload v0.19k result bundle
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v019k
          path: results_bundle_v019k.zip
