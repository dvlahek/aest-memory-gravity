name: GE19 Repair09 dual constraint prelock

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/repair09_*'
      - '.github/workflows/ge19-repair09-prelock-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install numpy scipy sympy

      - name: Compile
        run: python3 -m py_compile ge19/repair09_dual_constraint_partition_audit.py

      - name: Audit prereg and alternate partition
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, math
          from pathlib import Path
          import numpy as np

          root=Path.cwd()
          d=json.load(open("ge19/repair09_predata_dual_constraint_partition_audit.json"))
          assert d["classification"]=="GE19_REPAIR09_PREDATA_DUAL_CONSTRAINT_PARTITION_AUDIT"
          assert d["created_before_repair09_result"] is True
          assert d["diagnostic_only"] is True
          assert d["alternative_partition"]["algebraic_rows"]==[
              "pS","pu","pphi","pT","dust_density","shift"
          ]
          assert "no threshold change" in d["explicit_nonchanges"]
          assert "no background change" in d["explicit_nonchanges"]
          assert "no Z20 construction" in d["explicit_nonchanges"]

          def load(path,name):
              s=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(s)
              s.loader.exec_module(m)
              return m

          r7=load(root/"ge19/repair07_window_retarded_reduced_h3_z20_particular.py","r7")
          r9=load(root/"ge19/repair09_dual_constraint_partition_audit.py","r9")

          frozen=r7.load_frozen_generator(
              root/"ge06/analytic_aest_directional_source_generator.py","g6"
          )
          g6=r7.build_stable_ge06_generator_v2(frozen)
          g7=r7.load_frozen_generator(
              root/"ge07/pressureless_matter_directional_source_generator.py","g7"
          )

          x=np.linspace(math.log(0.4),math.log(1/1.2),8)
          a=np.exp(x)
          bg={
              "x":x,
              "a":a,
              "H":np.full_like(x,2.2e-4),
              "Q_action":np.full_like(x,1.0e-4+4.55e-17),
              "Z_action":np.full_like(x,4.55),
          }
          M,F,ZY,ZR,WY,WR,Cmat,bp,diag=r9.alt_operator_matrices(
              r7,g6,g7,bg,"C_star",0.05,float(x[3])
          )
          assert M.shape==(8,8)
          assert F.shape==(8,8)
          assert WY.shape==(10,8)
          assert WR.shape==(10,8)
          assert np.all(np.isfinite(M))
          assert np.all(np.isfinite(F))
          assert np.isfinite(diag["algebraic_scaled_condition_2"])

          y=np.asarray([.01,-.02,.03,-.01,.004,-.003,.002,-.001],complex)
          src=np.zeros(8,complex)
          w=WY@y+WR@src
          shift=(Cmat[10]+Cmat[11])@w
          scale=max(float(np.sum(np.abs((Cmat[10]+Cmat[11])*w))),1e-300)
          shift_metric=float(abs(shift)/scale)
          assert shift_metric < 1e-12, shift_metric

          # The alternative partition must not silently enforce anisotropy.
          aniso=(Cmat[12]+Cmat[13])@w
          print("ALT_ALGEBRAIC_CONDITION =",diag["algebraic_scaled_condition_2"])
          print("ALT_SHIFT_RECONSTRUCTION_METRIC =",shift_metric)
          print("ALT_ANISOTROPY_MONITOR_PROBE =",abs(aniso))
          print("GE19_REPAIR09_PRELOCK_AUDIT_PASS")
          PY
