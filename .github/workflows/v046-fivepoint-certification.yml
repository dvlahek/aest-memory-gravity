name: v046 locked-model five-point nuisance derivative certification

on:
  workflow_dispatch:
  push:
    paths:
      - 'v046/**'
      - '.github/workflows/v046-fivepoint-certification.yml'

jobs:
  fivepoint-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v046
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v046/output
          python3 v019/apply_patch_v019.py class_v046
          python3 v019i/apply_ic_patch.py class_v046
          python3 v019j/apply_memory_patch.py class_v046
          python3 v019w/apply_variational_forcing_patch.py class_v046
          python3 v019y/apply_output_precision_patch.py class_v046
          python3 v023/apply_source_grid_trace_patch.py class_v046
      - name: Build CLASS
        run: make -C class_v046 -j2 class
      - name: Source audit
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v046/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v046/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v046/include/common.h
      - name: Prepare five-point cases
        run: python3 v046/prepare_fivepoint_cases.py class_v046 --meta results/v046_meta.json
      - name: Run locked base and nuisance stencil
        shell: bash
        run: |
          set -euo pipefail
          PRE='../v019p/pre/p2.pre'
          (cd class_v046 && OMP_NUM_THREADS=1 ./class 'v046_kb0p0665_tau10_p0_base.ini' "$PRE") > results/v046_base.log 2>&1
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            for s in m2 m1 p1 p2; do
              (cd class_v046 && OMP_NUM_THREADS=1 ./class "v046_kb0p0665_tau10_p0_nuis_${q}_${s}.ini" "$PRE") > "results/v046_${q}_${s}.log" 2>&1
            done
          done
      - name: Analyse five-point certification
        shell: bash
        run: |
          set -euo pipefail
          python3 v046/analyse_fivepoint.py class_v046/output --json-out results/v046_fivepoint.json
      - name: Locked certification gate
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('results/v046_fivepoint.json'))
          assert all(q['gates'].values())
          print({'classification':q['classification'],'max_sin_principal_angle':q['max_sin_principal_angle']})
          PY
      - name: Upload v0.46 result
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v046
          path: |
            results/v046_fivepoint.json
            results/v046_meta.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v046_debug
          path: |
            results/*.json
            results/*.log
