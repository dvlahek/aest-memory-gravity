name: v064 data-blind clustering peak robustness

on:
  workflow_dispatch:
  push:
    branches: [v053-model-freeze-planck]
    paths:
      - 'v064/**'
      - '.github/workflows/v064-peak-robustness.yml'

jobs:
  peak-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v064

      - name: Install Python build dependencies
        run: python3 -m pip install --user numpy scipy cython

      - name: Apply unchanged validated AeST patches
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_v064
          python3 v019i/apply_ic_patch.py class_v064
          python3 v019j/apply_memory_patch.py class_v064
          python3 v019w/apply_variational_forcing_patch.py class_v064
          python3 v019y/apply_output_precision_patch.py class_v064
          python3 v023/apply_source_grid_trace_patch.py class_v064
          python3 tools/apply_v063_classy_runtime_reload_patch.py class_v064

      - name: Build CLASS executable
        run: make -C class_v064 -j2 class

      - name: Build and install patched classy
        run: make -C class_v064 -j2 classy

      - name: Predata audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -m py_compile v064/peak_robustness.py
          python3 - <<'PY'
          import json
          d=json.load(open('v064/predata_peak_robustness.json'))
          assert d['classification']=='V064_PREDATA_TANGENT_PEAK_ROBUSTNESS'
          assert d['created_before_v064_result'] is True
          assert d['uses_observational_data'] is False
          assert d['frozen_model']['KB']==0.0665
          assert d['frozen_model']['tauH0']==10.0
          assert d['frozen_model']['p']==0.0
          assert d['frozen_model']['tangent_amplitudes']==[5.0,10.0,20.0]
          assert d['dense_grid']['k_h_per_Mpc_min']==0.08
          assert d['dense_grid']['k_h_per_Mpc_max']==0.15
          assert d['dense_grid']['k_h_per_Mpc_step']==0.0005
          assert d['dense_grid']['z_min']==0.2
          assert d['dense_grid']['z_max']==0.7
          assert d['dense_grid']['z_step']==0.005
          assert d['source_result']['v063_run_id']==34061118644
          print('V064_PREDATA_PEAK_ROBUSTNESS_AUDIT_PASS')
          PY

      - name: Run dense tangent-amplitude robustness map
        shell: bash
        run: |
          set -euo pipefail
          # v0.64 is P(k)-only. Remove inherited CMB lensing-output request
          # from the old benchmark ini without changing perturbation physics.
          sed -i 's/^lensing = yes$/lensing = no/' v019/ini/aest_exp.ini
          python3 v064/peak_robustness.py \
            --class-root class_v064 \
            --json-out results/v064_peak_robustness_summary.json \
            --npz-out results/v064_peak_robustness_map.npz

      - name: Upload v0.64 robustness bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v064_peak_robustness
          path: |
            results/v064_peak_robustness_summary.json
            results/v064_peak_robustness_map.npz
            results/v063_theory_forcing.json
            results/v063_theory_trace.log
