name: GE19 Repair24 q20 prelock

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/repair24_*'
      - '.github/workflows/ge19-repair24-prelock-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install numpy scipy sympy

      - name: Compile
        run: python3 -m py_compile ge19/repair24_q20_construction.py

      - name: Frozen provenance and contract audit
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, subprocess
          from pathlib import Path

          def blob(path):
              return subprocess.check_output(["git","rev-parse",f"HEAD:{path}"],text=True).strip()

          assert blob("docs/ge19_repair22_z20_certification_result_freeze.md")=="fb4ef607d17b5545985edf557aa67d02bc4dff0f"
          assert blob("docs/ge19_repair23_q20_normalized_bath_bridge_result_freeze.md")=="5081fdf87e7e7f76849cf94e01f74c8df5dcca80"
          assert blob("ge19/repair24_predata_q20_construction.json")=="293815231e1afc1f1de75dabf9bd0b4475982f91"
          assert blob("ge19/repair24_q20_construction.py")=="f69027c9abda753a5178210224f2f1f695d4f936"
          assert blob("ge05/memory_directional_source_generator.py")=="40837d77f89028da30c28899e2d0530a4401844e"
          assert blob("nl1c4/expanding_memory_source_trajectory.py")=="7a9ffab9fa903ca61e88627052e2aa589b4bf459"
          assert blob("ge19/repair07_window_retarded_reduced_h3_z20_particular.py")=="e34d28a2062c748f48bc82fa928844b02631de25"

          pre=json.load(open("ge19/repair24_predata_q20_construction.json"))
          assert pre["classification"]=="GE19_REPAIR24_PREDATA_Q20_CONSTRUCTION"
          assert pre["created_before_result"] is True
          assert pre["frozen_theory"]["tauH0"]==10.0
          assert pre["frozen_state_scope"]["time_primary"]==128
          assert pre["frozen_state_scope"]["time_control"]==64
          assert pre["frozen_state_scope"]["spatial_primary"]==512
          assert pre["frozen_state_scope"]["spatial_control"]==256
          assert pre["frozen_state_scope"]["quadrature_primary"]==2048
          assert pre["frozen_state_scope"]["quadrature_control"]==1024
          assert pre["gates"]["G2_Nx256_vs_Nx512_low_mode_relative_L2_max"]==1e-10
          assert pre["gates"]["q20_quadrature_N1024_vs_N2048_weighted_z20_relative_L2_max"]==0.01
          assert pre["gates"]["q20_Nt64_vs_Nt128_weighted_z20_relative_L2_max"]==0.005

          spec=importlib.util.spec_from_file_location("r24","ge19/repair24_q20_construction.py")
          r24=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r24)
          assert r24.NQ_PRIMARY==2048
          assert r24.NQ_CONTROL==1024
          assert r24.NT_PRIMARY==128
          assert r24.NT_CONTROL==64
          assert r24.NX_PRIMARY==512
          assert r24.NX_CONTROL==256

          ge05=r24.load_quiet(Path("ge05/memory_directional_source_generator.py"),"ge05_prelock")
          c4=r24.load_quiet(Path("nl1c4/expanding_memory_source_trajectory.py"),"c4_prelock")
          _,diag=r24.build_normalized_c2_generator(ge05)
          assert diag["sqrtw_symbol_absent_after_normalization"] is True
          err=r24.step_nd_self_test(c4)
          assert err<=1e-12,err

          print("NORMALIZED_C2_SQRTW_ABSENT =",diag["sqrtw_symbol_absent_after_normalization"])
          print("STEP_ND_SELF_TEST =",err)
          print("GE19_REPAIR24_PRELOCK_AUDIT_PASS")
          PY
