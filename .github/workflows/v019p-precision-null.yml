name: v019p eta0 precision quasi-null test

on:
  workflow_dispatch:
  push:
    paths:
      - 'v019p/**'
      - '.github/workflows/v019p-precision-null.yml'

jobs:
  class-v019p:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_patched

      - name: Apply v0.19 eta0 patch
        run: python3 v019/apply_patch_v019.py class_patched

      - name: Build patched CLASS
        run: make -C class_patched -j2 class

      - name: Prepare precision campaign INIs
        run: |
          mkdir -p results class_patched/output
          python3 v019p/prepare_ini.py class_patched

      - name: Run CDM and Exp precision ladders
        shell: bash
        run: |
          set -euo pipefail
          for level in p0 p1 p2 p3; do
            echo "=== CDM ${level} ==="
            if [ "$level" = "p0" ]; then
              (cd class_patched && ./class "v019p_cdm_${level}.ini") > "results/v019p_cdm_${level}.log" 2>&1
            else
              (cd class_patched && ./class "v019p_cdm_${level}.ini" "../v019p/pre/${level}.pre") > "results/v019p_cdm_${level}.log" 2>&1
            fi
            echo "=== EXP ${level} ==="
            if [ "$level" = "p0" ]; then
              (cd class_patched && ./class "v019p_exp_${level}.ini") > "results/v019p_exp_${level}.log" 2>&1
            else
              (cd class_patched && ./class "v019p_exp_${level}.ini" "../v019p/pre/${level}.pre") > "results/v019p_exp_${level}.log" 2>&1
            fi
          done

      - name: Run Cosh p0 and p3 controls
        shell: bash
        run: |
          set -euo pipefail
          (cd class_patched && ./class v019p_cosh_p0.ini) > results/v019p_cosh_p0.log 2>&1
          (cd class_patched && ./class v019p_cosh_p3.ini ../v019p/pre/p3.pre) > results/v019p_cosh_p3.log 2>&1

      - name: Analyse precision convergence
        run: python3 v019p/analyse_precision.py class_patched/output --json-out results/v019p_precision.json

      - name: Write build report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('results/v019p_build_report.json').write_text(json.dumps({
            'patched_build':'PASS',
            'cdm_runs':'PASS',
            'exp_runs':'PASS',
            'cosh_runs':'PASS'
          },indent=2))
          PY

      - name: Create v0.19p result bundle
        run: python3 v019p/make_report.py

      - name: Upload v0.19p result bundle
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v019p
          path: results_bundle_v019p.zip
