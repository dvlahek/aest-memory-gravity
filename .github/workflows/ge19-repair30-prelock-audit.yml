name: GE19 Repair30 reduced H2 Z11 prelock

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/repair30_predata_reduced_h2_z11_reclosure.json'
      - 'ge19/repair30_reduced_h2_z11_reclosure.py'
      - '.github/workflows/ge19-repair30-prelock-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install static dependencies
        run: python3 -m pip install numpy scipy sympy

      - name: Audit Repair30 frozen contract
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD:ge19/repair30_predata_reduced_h2_z11_reclosure.json)" = "264b52832e762dd2010df1eba83e5f2c1a4d8874"
          test "$(git rev-parse HEAD:ge19/repair30_reduced_h2_z11_reclosure.py)" = "2ce2bf7ccd5bf48504c619500d12d4eb03bfe259"
          test "$(git rev-parse HEAD:docs/ge19_repair29b_r2_primary_r3_control_full_state_eta_tangent_result_freeze.md)" = "883b2c19486252e3173b459c3883653256854b31"
          test "$(git rev-parse HEAD:ge19/repair22_on_shell_parent_z20_certification.py)" = "4860d13c881f41dbacbdc16ff179e917644ea6a5"
          test "$(git rev-parse HEAD:ge19/repair27_cancellation_free_parent_q20_reconstruction.py)" = "adbab56e67f765ab5e2b37980abae42312a55b44"

          python3 -m py_compile ge19/repair30_reduced_h2_z11_reclosure.py

          python3 - <<'PY'
          import json
          import ge19.repair30_reduced_h2_z11_reclosure as r30

          p=json.load(open("ge19/repair30_predata_reduced_h2_z11_reclosure.json"))
          assert p["classification"]=="GE19_REPAIR30_PREDATA_REDUCED_H2_Z11_RECLOSURE"
          assert p["created_before_repair30_result"] is True
          assert p["uses_observational_data"] is False
          assert p["hierarchy"]["equation"]=="L_total Z11 = -M1[Z10,q10]"
          assert p["frozen_scope"]["primary_time_nodes"]==128
          assert p["frozen_scope"]["control_time_nodes"]==64
          assert p["memory_source"]["B10"]=="X10 - weighted_z10"
          assert p["memory_source"]["normalized_M1_exact_reduction"]["direct_metric_M1"]=="exactly zero"
          assert p["gates"]["primary128_vs_control64_Z11_state_relative_L2_max"]==0.005
          assert p["gates"]["reduced_chi11_vs_R2_parent_relative_L2_max"]==0.005
          assert p["stop_boundary"]["no_H4_Z21_solve_in_Repair30"] is True

          s=r30.symbolic_m1_audit()
          assert s["partial_px_identity"] is True
          assert s["partial_r_identity"] is True

          assert r30.R22_NPZ_SHA=="3020e0d040f902ab2609e05705f4508d9919665b1344fa0e641644ea8fc41a16"
          assert r30.R27_NPZ_SHA=="2b1566d402e4c9e8daee8e5c7084b3da7735442b4fb604d51489b708662fd9c0"
          assert r30.R28_NPZ_SHA=="101c38d91344d12071ecb343c35769326f80975e013b7d159f573aae73879705"
          assert r30.GE15_DENSE_SHA=="7f57ab676f2a31cf0abf93ff0f8b0f1f2f80bb9a58d7cf1e47e10a158c57c69f"

          src=open("ge19/repair30_reduced_h2_z11_reclosure.py").read()
          assert 'rhs[im,2]=0.5*bg["Q_action"]*bg["a"]**3*B[im]' in src
          assert 'rhs[im,3]=-0.5*bg["a"]**2*(1j*k)*B[im]' in src
          assert '"H4_Z21_solve_performed":False' in src
          print("GE19_REPAIR30_PRELOCK_PASS")
          PY
