name: NL1C7B4 Repair02 exact nonlinear dictionary constraint audit

on:
  push:
    branches: [nl1c7b-eta0-spherical-evolution]
    paths:
      - '.github/workflows/nl1c7b4-repair02-exact-nonlinear-dictionary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy sympy

      - name: Verify frozen Repair02 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ebb6d1a03dbd360f0c7169bb382bc98cd4c5dc49 HEAD
          git merge-base --is-ancestor 894b2f7a9c335636fb5f2d32c00b7d1d8a9b5b83 HEAD
          git merge-base --is-ancestor c4b2b36752e3c727998e58107abda73162d38bf1 HEAD
          git merge-base --is-ancestor c158cbaa8bcfbd3bec9feb0a3449b66aec0e63d0 HEAD
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification_repair02.py)" = "eff076ec9a511f64bc693dc48b07b2ce26cfbaeb"
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification.py)" = "8559120dc273be3174eca130ca313ed6ff5acb25"
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification_repair01.py)" = "253a0ae2a19a597f06358704ea276c9005973af3"
          test "$(git rev-parse HEAD:nl1c6/spherical_self_gravity_g1_g10.py)" = "e3eeb820fa1826fb7ac29f3fce2fe0bdde8d564f"
          test "$(git rev-parse HEAD:nl1c7b/pressureless_matter_variational_closure.py)" = "485ed20a642ffe868b01c30196154b4834e18e10"
          for spec in \
            '10481526695 sha256:c2ede2e602e35bbd52afdc0a5eee22cb1bf5c6efc2e1063bf8f2b91a0554fb6c' \
            '10469031693 sha256:193325536405f9a21a238f5fbe71a772d2484a096dcbfec3d6007e825cc38f70' \
            '10493461020 sha256:0cd7ff857d2965915176563341a18d2979f82ebe3ea59be090459030018c1aa0'; do
              set -- ${spec}; id="$1"; dig="$2"
              j="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/${id}")"
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["digest"]==sys.argv[1]; assert d["expired"] is False' "${dig}" <<<"${j}"
          done
          echo NL1C7B4_REPAIR02_PROVENANCE_PASS

      - name: Download exact retained C7A inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/final input/dense results
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10481526695/zip -o input/final.zip
          unzip -q input/final.zip -d input/final
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10469031693/zip -o input/dense.zip
          unzip -q input/dense.zip -d input/dense
          test -s input/final/nl1c7a_repair01_evalfix_primary_states.npz
          test -s input/dense/nl1c7a_repair01_dense_trace.dat
          test -s input/dense/nl1c7a_repair01_dense_coverage.json

      - name: Execute frozen Repair02 audit
        shell: bash
        run: |
          set +e
          set -uo pipefail
          PYTHONPATH="$PWD" python3 nl1c7b/initial_constraint_certification_repair02.py \
            --trace input/dense/nl1c7a_repair01_dense_trace.dat \
            --coverage-json input/dense/nl1c7a_repair01_dense_coverage.json \
            --official-npz input/final/nl1c7a_repair01_evalfix_primary_states.npz \
            --out results/nl1c7b4_repair02_exact_nonlinear_dictionary.json \
            2>&1 | tee results/nl1c7b4_repair02_exact_nonlinear_dictionary.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "SCIENCE_RC=${rc}"
          test "${rc}" -eq 0 -o "${rc}" -eq 2

      - name: Verify scientific classification integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c7b4_repair02_exact_nonlinear_dictionary.json'))
          allowed={
            'NL1C7B4_REPAIR02_EXACT_NONLINEAR_DICTIONARY_CONSTRAINT_PASS',
            'NL1C7B4_REPAIR02_DICTIONARY_COMPLETED_RAW_CONSTRAINT_FAIL',
            'NL1C7B4_REPAIR02_DICTIONARY_COMPLETION_IMPLEMENTATION_FAIL',
          }
          assert d['classification'] in allowed
          assert d['state_reproduction']['pass'] is True
          assert d['symbolic_K_dictionary_identity'] is True
          assert d['summary']['n_constraint_cases']==54
          assert d['summary']['n_grid_pairs']==27
          assert d['claim_boundary']['only_phidot_completed'] is True
          assert d['claim_boundary']['constraint_projection_used'] is False
          assert d['claim_boundary']['amplitude_or_phase_fit_used'] is False
          if d['classification']!='NL1C7B4_REPAIR02_DICTIONARY_COMPLETION_IMPLEMENTATION_FAIL':
              assert d['gates']['R2_G1_exact_target_preservation'] is True
              assert d['gates']['R2_G3_Exp_domain_restoration'] is True
          print(d['classification'])
          print(json.dumps(d['summary'],sort_keys=True))
          PY

      - name: Upload Repair02 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c7b4_repair02_exact_nonlinear_dictionary
          path: |
            results/nl1c7b4_repair02_exact_nonlinear_dictionary.json
            results/nl1c7b4_repair02_exact_nonlinear_dictionary.log
          if-no-files-found: error
