name: v058 Planck high-l plus low-l eta profile

on:
  workflow_dispatch:
  push:
    branches: [v053-model-freeze-planck]
    paths:
      - 'v058/**'
      - '.github/workflows/v058-planck-eta-profile.yml'

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        eta: [-30, -20, -10, 0, 10, 20, 30]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v058
      - name: Install dependencies and native Planck likelihood data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user numpy scipy 'cobaya==3.6.2' getdist
          mkdir -p planck_packages results class_v058/output
          python3 -m cobaya.install planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lowl.TT planck_2018_lowl.EE -p "$GITHUB_WORKSPACE/planck_packages"
      - name: Apply unchanged validated AeST patches
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_v058
          python3 v019i/apply_ic_patch.py class_v058
          python3 v019j/apply_memory_patch.py class_v058
          python3 v019w/apply_variational_forcing_patch.py class_v058
          python3 v019y/apply_output_precision_patch.py class_v058
          python3 v023/apply_source_grid_trace_patch.py class_v058
      - name: Build CLASS
        run: make -C class_v058 -j2 class
      - name: Freeze and predata audit
        shell: bash
        run: |
          set -euo pipefail
          python3 v053/audit_model_freeze.py v053/model_freeze.json --json-out results/v058_freeze_reaudit.json
          python3 -m py_compile v058/planck_eta_profile.py v058/compare_eta_profile.py
          python3 - <<'PY'
          import json
          d=json.load(open('v058/predata_planck_eta_profile.json'))
          assert d['classification']=='V058_PREDATA_PLANCK_ETA_PROFILE_DECLARATION'
          assert d['eta_grid']==[-30.0,-20.0,-10.0,0.0,10.0,20.0,30.0]
          assert d['frozen_model']['KB']==0.0665 and d['frozen_model']['tauH0']==10.0 and d['frozen_model']['lambda']==10.0
          print('V058_PREDATA_AUDIT_PASS')
          PY
      - name: Run fixed-eta combined Planck profile member
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(python3 - <<'PY'
          x=float('${{ matrix.eta }}')
          print(('m' if x<0 else 'p')+str(int(abs(x))))
          PY
          )
          python3 v058/planck_eta_profile.py --class-root class_v058 --packages planck_packages --eta '${{ matrix.eta }}' --json-out "results/v058_eta_${TAG}.json"
      - name: Upload v0.58 profile member
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v058_eta_${{ matrix.eta }}
          path: |
            results/v058_eta_*.json
            results/v058_freeze_reaudit.json
            results/v056_it*_forcing.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v058_debug_eta_${{ matrix.eta }}
          path: |
            results/*.json
            results/*.log

  compare:
    needs: profile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Download profile members
        uses: actions/download-artifact@v4
        with:
          pattern: results_bundle_v058_eta_*
          path: gathered
          merge-multiple: true
      - name: Compare eta profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 v058/compare_eta_profile.py --input-dir gathered --json-out results/v058_planck_eta_profile.json
      - name: Upload v0.58 profile comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v058_comparison
          path: results/v058_planck_eta_profile.json
