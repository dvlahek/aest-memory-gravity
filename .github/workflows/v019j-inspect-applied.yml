name: v019j inspect applied eta0 source

on:
  workflow_dispatch:
  push:
    paths:
      - 'v019j/**'
      - '.github/workflows/v019j-inspect-applied.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_patched
      - name: Apply eta0 bridge and leading adiabatic IC patch
        run: |
          python3 v019/apply_patch_v019.py class_patched
          python3 v019i/apply_ic_patch.py class_patched
      - name: Print AeST state allocation, IC and derivatives
        shell: bash
        run: |
          echo '=== perturbations.h indices ==='
          grep -n -C 5 'index_pt_alpha_aest' class_patched/include/perturbations.h
          echo '=== background AeST inputs ==='
          grep -n -C 8 'aest_enabled' class_patched/include/background.h | head -80
          echo '=== allocation/copy/IC/derivatives contexts ==='
          grep -n -C 35 'index_pt_alpha_aest' class_patched/source/perturbations.c
          echo '=== input parser context ==='
          grep -n -C 20 'aest_enabled' class_patched/source/input.c | head -140
