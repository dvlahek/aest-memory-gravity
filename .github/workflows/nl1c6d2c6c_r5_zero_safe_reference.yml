name: C3 R5 zero-coupling-safe tangent repair

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c6c_r5_zero_safe_reference.yml'
      - 'nl1c6d2c6c_r5/**'

concurrency:
  group: c3-r5-zero-safe-tangent
  cancel-in-progress: true

jobs:
  r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated R5 zero-safe CLASS
        run: bash nl1c6d2c6c_r5/setup_zero_safe_class.sh

      - name: Verify eta0 zero coupling after R5 patch
        id: zero
        shell: bash
        run: |
          set +e
          source results/c3_r5_class_env.sh
          python -u nl1c6d2c6c_zeroaudit/eta0_zero_coupling.py 2>&1 | tee results/c3_r5_zero_coupling.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build zero-safe eta0 tangent reference
        id: ref
        if: steps.zero.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          source results/c3_r5_class_env.sh
          python -u nl1c6d2c6c_r5/build_zero_safe_reference.py 2>&1 | tee results/c3_r5_reference.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate unchanged original C3 gate
        id: gate
        if: steps.zero.outputs.exit_code == '0' && steps.ref.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          source results/c3_r5_class_env.sh
          python -u nl1c6d2c6c_r5/evaluate_r5_c3_gate.py 2>&1 | tee results/c3_r5_gate.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write R5 summary
        if: always()
        shell: bash
        run: |
          echo '## C3 R5 zero-coupling-safe tangent repair' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          for f in results/c3_r5_zero_coupling.log results/c3_r5_reference.log results/c3_r5_gate.log; do
            if [[ -f "$f" ]]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              grep -E '^(ZERO_MODE|ZERO_GLOBAL|ZERO_COUPLING_PASS=|R5_FORCE_MODE|R5_C3|CLASSIFICATION=|FINITE_POSITIVE_ETA_NONLINEAR_MEMORY_LICENSED=|C3_R5_)' "$f" >> "$GITHUB_STEP_SUMMARY" || true
              echo '' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload R5 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3_r5_zero_safe_tangent
          path: |
            results/c3_r5*
          if-no-files-found: warn

      - name: Propagate scientific result
        if: always()
        shell: bash
        run: |
          z='${{ steps.zero.outputs.exit_code }}'
          r='${{ steps.ref.outputs.exit_code }}'
          g='${{ steps.gate.outputs.exit_code }}'
          echo "zero_exit=$z ref_exit=$r gate_exit=$g"
          if [[ "$z" != '0' ]]; then exit 11; fi
          if [[ "$r" != '0' ]]; then exit 12; fi
          if [[ "$g" != '0' ]]; then exit "$g"; fi
          exit 0
