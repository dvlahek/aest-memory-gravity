name: NL1C6D2C6C eta0 nonlinear memory tangent

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c6c_eta0_nonlinear_memory_tangent.yml'
      - 'nl1c6d2c6c/**'
      - 'docs/nl1c6d2c6c_*'

permissions:
  contents: read

concurrency:
  group: nl1c6d2c6c-eta0-nonlinear-memory-tangent
  cancel-in-progress: false

jobs:
  eta0-nonlinear-memory-tangent:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated corrected tau1 CLASS
        run: bash nl1c6d2c6c/setup_corrected_class_tau1.sh

      - name: Run preregistered D2C6C eta0 nonlinear memory tangent
        run: bash nl1c6d2c6c/run_local.sh

      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2C6C eta0 nonlinear memory tangent' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c6c_eta0_nonlinear_memory_tangent.log ]]; then
            grep -E '^(C2_BRIDGE|C3_LINEAR|MEMBER |WORST_|GATES=|CLASSIFICATION=|FINITE_POSITIVE_ETA_NONLINEAR_MEMORY_LICENSED=)' \
              results/nl1c6d2c6c_eta0_nonlinear_memory_tangent.log >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload D2C6C result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl1c6d2c6c_eta0_nonlinear_memory_tangent
          path: |
            results/nl1c6d2c6c_*
          if-no-files-found: warn
