name: v047 strict-accuracy five-point nuisance certification

on:
  workflow_dispatch:
  push:
    paths:
      - 'v047/**'
      - '.github/workflows/v047-strict-accuracy.yml'

jobs:
  strict-accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v047
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v047/output
          python3 v019/apply_patch_v019.py class_v047
          python3 v019i/apply_ic_patch.py class_v047
          python3 v019j/apply_memory_patch.py class_v047
          python3 v019w/apply_variational_forcing_patch.py class_v047
          python3 v019y/apply_output_precision_patch.py class_v047
          python3 v023/apply_source_grid_trace_patch.py class_v047
      - name: Build CLASS
        run: make -C class_v047 -j2 class
      - name: Source and precision audit
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v047/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v047/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v047/include/common.h
          grep -q 'tol_perturb_integration = 5.e-8' v047/p3.pre
          grep -q 'perturb_sampling_stepsize = 0.0025' v047/p3.pre
      - name: Prepare identical v0.46 five-point cases
        run: python3 v046/prepare_fivepoint_cases.py class_v047 --meta results/v047_meta.json
      - name: Run locked base and nuisance stencil at strict accuracy
        shell: bash
        run: |
          set -euo pipefail
          PRE='../v047/p3.pre'
          (cd class_v047 && OMP_NUM_THREADS=1 ./class 'v046_kb0p0665_tau10_p0_base.ini' "$PRE") > results/v047_base.log 2>&1
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            for s in m2 m1 p1 p2; do
              (cd class_v047 && OMP_NUM_THREADS=1 ./class "v046_kb0p0665_tau10_p0_nuis_${q}_${s}.ini" "$PRE") > "results/v047_${q}_${s}.log" 2>&1
            done
          done
      - name: Analyse identical five-point certification
        shell: bash
        run: |
          set -euo pipefail
          python3 v046/analyse_fivepoint.py class_v047/output --json-out results/v047_raw_fivepoint.json || test $? -eq 2
          test -s results/v047_raw_fivepoint.json
      - name: Strict-accuracy locked certification
        shell: bash
        run: |
          set -euo pipefail
          python3 v047/certify_strict_accuracy.py results/v047_raw_fivepoint.json --json-out results/v047_strict_accuracy.json
      - name: Upload v0.47 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v047
          path: |
            results/v047_raw_fivepoint.json
            results/v047_strict_accuracy.json
            results/v047_meta.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v047_debug
          path: |
            results/*.json
            results/*.log
