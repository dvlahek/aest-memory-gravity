name: v038 dense refitted critical-window memory scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'v038/**'
      - '.github/workflows/v038-dense-refitted-memory.yml'
      - 'v032/analyse_transition_case.py'

jobs:
  dense-refitted-memory:
    strategy:
      fail-fast: false
      matrix:
        kb: [0.0655, 0.0660, 0.0665, 0.0670]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v038
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v038/output
          python3 v019/apply_patch_v019.py class_v038
          python3 v019i/apply_ic_patch.py class_v038
          python3 v019j/apply_memory_patch.py class_v038
          python3 v019w/apply_variational_forcing_patch.py class_v038
          python3 v019y/apply_output_precision_patch.py class_v038
          python3 v023/apply_source_grid_trace_patch.py class_v038
      - name: Build CLASS
        run: make -C class_v038 -j2 class
      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v038/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v038/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v038/include/common.h
      - name: Nonlinear six-parameter refit for this KB
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(echo '${{ matrix.kb }}' | sed 's/\./p/g')
          python3 v031/refit_baseline.py class_v038 --kb '${{ matrix.kb }}' --iters 6 --json-out "results/v038_refit_${TAG}.json"
          echo "REFIT_JSON=results/v038_refit_${TAG}.json" >> "$GITHUB_ENV"
      - name: Prepare memory case at verified refitted cosmology
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(python3 v038/prepare_refitted_scan_case.py class_v038 --kb '${{ matrix.kb }}' --refit-json "$REFIT_JSON" --meta results/v038_meta.json | tail -1)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "KB=${{ matrix.kb }}" >> "$GITHUB_ENV"
      - name: Run refitted candidate and matched KB=0.1 reference
        shell: bash
        run: |
          set -euo pipefail
          (cd class_v038 && AEST_OFFLINE_TRACE_FILE="$GITHUB_WORKSPACE/results/v038_${TAG}_trace.dat" OMP_NUM_THREADS=1 ./class "v038_${TAG}_base.ini" ../v019p/pre/p3.pre) > "results/v038_${TAG}_base.log" 2>&1
          (cd class_v038 && OMP_NUM_THREADS=1 ./class "v038_${TAG}_ref.ini" ../v019p/pre/p3.pre) > "results/v038_${TAG}_ref.log" 2>&1
          test -s "results/v038_${TAG}_trace.dat"
      - name: Build accepted-grid tauH0=10 positive Drude forcing
        shell: bash
        run: |
          set -euo pipefail
          python3 v027/build_tau10_forcing.py "results/v038_${TAG}_trace.dat" --KB "$KB" --out-prefix "results/v038_${TAG}" \
            --control-order 512 --primary-order 1024 --summary "results/v038_${TAG}_forcing.json"
      - name: Run six nuisance directions at refitted point
        shell: bash
        run: |
          set -euo pipefail
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            (cd class_v038 && OMP_NUM_THREADS=1 ./class "v038_${TAG}_nuis_${q}_p.ini" ../v019p/pre/p3.pre) > "results/v038_${TAG}_nuis_${q}_p.log" 2>&1 & a=$!
            (cd class_v038 && OMP_NUM_THREADS=1 ./class "v038_${TAG}_nuis_${q}_m.ini" ../v019p/pre/p3.pre) > "results/v038_${TAG}_nuis_${q}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Run full lambda ladder at refitted point
        shell: bash
        run: |
          set -euo pipefail
          FORCE="$GITHUB_WORKSPACE/results/v038_${TAG}_force.dat"
          for L in 1 3 10 30 100 300 1000; do
            (cd class_v038 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="$L" OMP_NUM_THREADS=1 ./class "v038_${TAG}_l${L}_p.ini" ../v019p/pre/p3.pre) > "results/v038_${TAG}_l${L}_p.log" 2>&1 & a=$!
            (cd class_v038 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="-$L" OMP_NUM_THREADS=1 ./class "v038_${TAG}_l${L}_m.ini" ../v019p/pre/p3.pre) > "results/v038_${TAG}_l${L}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Analyse refitted memory tangent
        shell: bash
        run: |
          set -euo pipefail
          python3 v032/analyse_transition_case.py class_v038/output --tag "$TAG" --kb "$KB" --prefix v038 \
            --force-control "results/v038_${TAG}_force_control.dat" --force-primary "results/v038_${TAG}_force.dat" \
            --json-out "results/v038_${TAG}_analysis.json"
      - name: Upload v0.38 result
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v038_refitted_memory_kb_${{ matrix.kb }}
          path: |
            results/v038_refit_*.json
            results/v038_*_analysis.json
            results/v038_*_forcing.json
            results/v038_meta.json
            results/v023_trace_patch.json
      - name: Upload v0.38 debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v038_debug_kb_${{ matrix.kb }}
          path: |
            results/*.json
            results/*.log
