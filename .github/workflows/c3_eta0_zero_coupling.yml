name: C3 CLASS eta0 zero-coupling audit

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/c3_eta0_zero_coupling.yml'
      - 'nl1c6d2c6c_zeroaudit/**'

jobs:
  zero-coupling:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated corrected tau1 CLASS
        run: bash nl1c6d2c6c/setup_corrected_class_tau1.sh

      - name: Run preregistered eta0 zero-coupling audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          source results/nl1c6d2c6c_class_env.sh
          python -u nl1c6d2c6c_zeroaudit/eta0_zero_coupling.py 2>&1 | tee results/c3_eta0_zero_coupling.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Write compact zero-coupling summary
        if: always()
        shell: bash
        run: |
          echo '## CLASS eta=0 zero-coupling audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/c3_eta0_zero_coupling.log ]]; then
            grep -E '^(ZERO_MODE|ZERO_GLOBAL|ZERO_COUPLING_PASS=|CLASSIFICATION=|FINITE_POSITIVE_ETA_NONLINEAR_MEMORY_LICENSED=|C3_ZERO_COUPLING_ERROR)' results/c3_eta0_zero_coupling.log >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload zero-coupling bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3_eta0_zero_coupling
          path: |
            results/c3_eta0_zero_coupling*
          if-no-files-found: warn

      - name: Propagate audit result
        if: always()
        shell: bash
        run: |
          code='${{ steps.audit.outputs.exit_code }}'
          if [[ -z "$code" ]]; then
            echo 'audit did not report an exit code'
            exit 3
          fi
          exit "$code"
