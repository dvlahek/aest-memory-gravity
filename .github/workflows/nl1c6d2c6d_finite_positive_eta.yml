name: D2C6D finite-positive-eta retained continuation

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c6d_finite_positive_eta.yml'
      - 'nl1c6d2c6d/**'

permissions:
  contents: read

concurrency:
  group: d2c6d-finite-positive-eta-retained
  cancel-in-progress: true

jobs:
  finite-positive-eta:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Static syntax check
        run: python -m py_compile nl1c6d2c6d/finite_positive_eta_retained.py

      - name: Build isolated zero-safe CLASS
        run: bash nl1c6d2c6c_r5/setup_zero_safe_class.sh

      - name: Run preregistered D2C6D finite-positive-eta test
        id: d2c6d
        shell: bash
        run: |
          set +e
          bash nl1c6d2c6d/run_local.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write compact D2C6D summary
        if: always()
        shell: bash
        run: |
          echo '## D2C6D finite-positive-eta retained continuation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c6d_finite_positive_eta_retained.log ]]; then
            grep -E '^(D2_SOURCE|D3_TANGENT_CONTINUATION_MAX=|WORST_BATH_ORDER=|WORST_TIME=|WORST_SPACE=|GATES=|CLASSIFICATION=|LARGER_AMPLITUDE_RETAINED_ETA_STEP_LICENSED=|FULL_NONLINEAR_OR_OBSERVATIONAL_STEP_LICENSED=|D2C6D_INCOMPLETE|D2C6D_ERROR)' \
              results/nl1c6d2c6d_finite_positive_eta_retained.log >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload D2C6D result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl1c6d2c6d_finite_positive_eta_retained
          path: |
            results/nl1c6d2c6d_*
          if-no-files-found: warn

      - name: Propagate scientific result
        if: always()
        shell: bash
        run: |
          code='${{ steps.d2c6d.outputs.exit_code }}'
          echo "d2c6d_exit=$code"
          if [[ -z "$code" ]]; then exit 13; fi
          exit "$code"
