name: GE19 H4F2g Six Piece Signed Source Ledger

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/h4f2g_predata_six_piece_signed_source_ward_ledger.json'
      - 'ge19/h4f2g_action_completed_six_piece_source_ledger.py'
      - 'ge19/h4f2g_six_piece_source_ledger_selftest.py'
      - '.github/workflows/ge19-h4f2g-six-piece-source-ledger.yml'

jobs:
  signed-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen source-only test dependencies
        run: python3 -m pip install numpy scipy sympy
      - name: Verify locked six-piece source ledger and common row/ward signs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD:ge19/h4f2g_predata_six_piece_signed_source_ward_ledger.json)" = "70bee663a0f529a734b586dbc8b9f6e90bc8ed9f"
          test "$(git rev-parse HEAD:ge19/h4f2g_action_completed_six_piece_source_ledger.py)" = "d9778da0bb6cc52a15015238810c79978527ffc5"
          test "$(git rev-parse HEAD:ge19/h4f2g_six_piece_source_ledger_selftest.py)" = "eb33a29e4be5975cef65b5ea62ac94b79d51114d"
          python3 -m py_compile \
            ge19/h4f2g_action_completed_six_piece_source_ledger.py \
            ge19/h4f2g_six_piece_source_ledger_selftest.py
          python3 -m ge19.h4f2g_six_piece_source_ledger_selftest \
            --json-out results/ge19_h4f2g_signed_six_piece_source_ledger.json \
            > results/ge19_h4f2g_signed_six_piece_source_ledger_FULL.log
          python3 - <<'PY'
          import json
          p="results/ge19_h4f2g_signed_six_piece_source_ledger.json"
          d=json.load(open(p))
          assert d["classification"]=="GE19_H4F2G_SIGNED_SIX_PIECE_SOURCE_LEDGER_PASS_FULL_NOETHER_OPEN"
          assert d["all_source_ledger_gates_pass"] is True
          assert all(v["exact"] for v in d["frozen_blobs"].values())
          assert all(d["frozen_implementation_bindings"].values())
          assert len(d["six_piece_order"])==6
          assert len(d["source_row_order"])==8
          assert all(b["all_numeric_gates_pass"] for b in d["source_only_beta_cases"])
          assert d["actual_StageE_Y_H4_source_generator_used"] is True
          assert d["actual_GE05_M1_generator_used"] is True
          assert d["external_GE06_GE07_Lambda_M2_arrays_are_synthetic_controls"] is True
          assert d["external_source_amplitudes_authenticated_on_corrected_parents"] is False
          assert d["full_six_piece_parent_operator_Noether_derived"] is False
          assert d["common_corrected_parent_source_evaluated"] is False
          assert d["H4_Z21_solve_performed"] is False
          assert d["Z21_certified"] is False
          assert d["lensing_licensed"] is False
          print("GE19_H4F2G_SIX_PIECE_SIGNED_SOURCE_LEDGER_PASS")
          PY
          sha256sum results/ge19_h4f2g_signed_six_piece_source_ledger.json
          wc -c results/ge19_h4f2g_signed_six_piece_source_ledger.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge19_h4f2g_signed_six_piece_source_ledger
          path: |
            results/ge19_h4f2g_signed_six_piece_source_ledger.json
            results/ge19_h4f2g_signed_six_piece_source_ledger_FULL.log
          retention-days: 90
