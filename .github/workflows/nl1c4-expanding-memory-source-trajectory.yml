name: NL1C4 expanding memory-source trajectory

on:
  workflow_dispatch:
  push:
    branches: [nl1c4-expanding-memory-source]
    paths:
      - 'nl1c4/**'
      - 'nl1c3b/**'
      - 'docs/nl1c4_predata_expanding_memory_source_trajectory.md'
      - '.github/workflows/nl1c4-expanding-memory-source-trajectory.yml'

jobs:
  expanding-memory-source-trajectory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy sympy

      - name: Verify frozen preregistration and implementation lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/nl1c4_predata_expanding_memory_source_trajectory.md)" = "c8174b6146f4fd440d50d5595700840cc101188b"
          python3 -m py_compile nl1c4/expanding_memory_source_trajectory.py
          python3 - <<'PY'
          import json
          d=json.load(open('nl1c4/implementation_lock.json'))
          assert d['classification']=='NL1C4_IMPLEMENTATION_LOCK_BEFORE_OFFICIAL_RUN'
          assert d['frozen_predata_document_blob_sha']=='c8174b6146f4fd440d50d5595700840cc101188b'
          assert d['artifact']['run_id']==34315590099
          assert d['artifact']['artifact_id']==10090367181
          assert d['artifact']['digest']=='sha256:24b97e5738eb07be4f12d433ff5f9fe22249e199e186d5617aca5dc81f748378'
          assert d['quadrature_orders']=={'control':512,'primary':1024}
          assert d['spatial_resolutions']==[256,512]
          assert 'maximum pointwise' in d['relative_difference_gate_definition']
          print('NL1C4_IMPLEMENTATION_LOCK_PASS')
          PY

      - name: Re-run NL1C3B dependency gate
        shell: bash
        run: |
          set -euo pipefail
          python3 nl1c3b/longitudinal_3plus1_memory_bridge.py > nl1c3b_run.log
          python3 - <<'PY'
          import json
          r=json.load(open('results/nl1c3b_longitudinal_3plus1_memory_bridge.json'))
          assert r['classification']=='NL1C3B_LONGITUDINAL_3PLUS1_MEMORY_BRIDGE_PASS', r['classification']
          assert all(r['locked_gates'].values())
          print(r['classification'])
          PY

      - name: Verify frozen v0.77 artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10090367181" \
            -o results/nl1c4_artifact_metadata.json
          python3 - <<'PY'
          import json
          a=json.load(open('results/nl1c4_artifact_metadata.json'))
          assert a['id']==10090367181
          assert a['workflow_run']['id']==34315590099
          assert a['digest']=='sha256:24b97e5738eb07be4f12d433ff5f9fe22249e199e186d5617aca5dc81f748378'
          assert a['expired'] is False
          print('NL1C4_FROZEN_ARTIFACT_PROVENANCE_PASS')
          PY

      - name: Download exact retained v0.77 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10090367181
          path: frozen_v077
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34315590099

      - name: Run NL1C4 expanding source trajectory
        shell: bash
        run: |
          set -euo pipefail
          TRACE="$(find frozen_v077 -type f -name v076_v077_base_trace.dat -print -quit)"
          test -n "${TRACE}"
          python3 nl1c4/expanding_memory_source_trajectory.py \
            --trace "${TRACE}" \
            --artifact-meta-json results/nl1c4_artifact_metadata.json \
            --json-out results/nl1c4_expanding_memory_source_trajectory.json \
            --csv-out results/nl1c4_expanding_memory_source_trajectory.csv \
            | tee results/nl1c4_expanding_memory_source_trajectory.log

      - name: Verify final classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('results/nl1c4_expanding_memory_source_trajectory.json'))
          assert r['classification']=='NL1C4_EXPANDING_MEMORY_SOURCE_TRAJECTORY_PASS', r['classification']
          assert all(r['gates'].values()), r['gates']
          print(r['classification'])
          PY

      - name: Upload NL1C4 theory bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c4_expanding_memory_source_trajectory
          path: |
            results/nl1c4_artifact_metadata.json
            results/nl1c3b_longitudinal_3plus1_memory_bridge.json
            results/nl1c4_expanding_memory_source_trajectory.json
            results/nl1c4_expanding_memory_source_trajectory.csv
            results/nl1c4_expanding_memory_source_trajectory.log
            nl1c3b_run.log
            nl1c4/implementation_lock.json
            docs/nl1c4_predata_expanding_memory_source_trajectory.md
          if-no-files-found: warn
