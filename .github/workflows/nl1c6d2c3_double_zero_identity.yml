name: NL1C6D2C3 double-zero completion identity

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c3_double_zero_identity.yml'
      - 'nl1c6d2c3/**'
      - 'docs/nl1c6d2c3_*'

permissions:
  contents: read

concurrency:
  group: nl1c6d2c3-double-zero-identity
  cancel-in-progress: false

jobs:
  identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install numpy scipy

      - name: Run preregistered D2C3 identity audit
        run: bash nl1c6d2c3/run_local.sh

      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2C3 double-zero completion identity' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c3_double_zero_completion_identity.log ]]; then
            grep -E '^(C3\.|CLASSIFICATION=)' results/nl1c6d2c3_double_zero_completion_identity.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
