name: v050 locked-model optimizer basin bridge audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'v050/**'
      - '.github/workflows/v050-optimizer-basin-bridge.yml'

jobs:
  basin-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v050
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated AeST baseline patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v050/output
          python3 v019/apply_patch_v019.py class_v050
          python3 v019i/apply_ic_patch.py class_v050
          python3 v019j/apply_memory_patch.py class_v050
          python3 v019y/apply_output_precision_patch.py class_v050
      - name: Build CLASS
        run: make -C class_v050 -j2 class
      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define _OUTPUTPRECISION_ 17' class_v050/include/common.h
          grep -q 'aest_memory_enabled' class_v050/source/input.c
          grep -q 'aest_KB' class_v050/source/input.c
      - name: Audit fixed optimizer bridges
        shell: bash
        run: |
          set -euo pipefail
          python3 v050/audit_optimizer_bridges.py class_v050 --json-out results/v050_optimizer_bridge.json
      - name: Upload v0.50 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v050_optimizer_bridge
          path: results/v050_optimizer_bridge.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v050_debug
          path: |
            results/*.json
            results/*.log
