name: v019w Exp tauH0=1 variational tangent

on:
  workflow_dispatch:
  push:
    paths:
      - 'v019w/**'
      - '.github/workflows/v019w-exp-variational-tangent.yml'

jobs:
  variational-tangent-v019w:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_var

      - name: Apply AeST eta0 bridge, IC, validated tau1 bath and variational patch
        run: |
          mkdir -p results class_var/output
          python3 v019/apply_patch_v019.py class_var
          python3 v019i/apply_ic_patch.py class_var
          python3 v019j/apply_memory_patch.py class_var
          python3 v019u/apply_tau1_bath_patch.py class_var
          sed -i 's/pba->aest_memory_order = 16;/pba->aest_memory_order = 39;/' class_var/source/input.c
          python3 v019w/apply_variational_forcing_patch.py class_var

      - name: Build variational diagnostic CLASS
        run: make -C class_var -j2 class

      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aest_tangent_trace_force' class_var/source/perturbations.c
          grep -q 'aest_tangent_external_force' class_var/source/perturbations.c
          grep -q 'AEST_TANGENT_FORCE_FILE' class_var/source/aest_memory.c
          grep -q 'E_rhs_aest -= 0.5\*Q_aest\*Bchi_aest' class_var/source/perturbations.c

      - name: Prepare v0.19w inputs
        run: python3 v019w/prepare_v019w_ini.py class_var

      - name: Trace N39 eta0 forcing p3
        shell: bash
        run: |
          set -euo pipefail
          (cd class_var && AEST_TANGENT_TRACE_FILE="$GITHUB_WORKSPACE/results/v019w_force39_raw.dat" OMP_NUM_THREADS=1 ./class v019w_trace39.ini ../v019p/pre/p3.pre) > results/v019w_trace39.log 2>&1
          python3 v019w/normalize_force_table.py results/v019w_force39_raw.dat results/v019w_force39.dat --json-out results/v019w_force39_stats.json

      - name: Trace N47 eta0 forcing p3
        shell: bash
        run: |
          set -euo pipefail
          (cd class_var && AEST_TANGENT_TRACE_FILE="$GITHUB_WORKSPACE/results/v019w_force47_raw.dat" OMP_NUM_THREADS=1 ./class v019w_trace47.ini ../v019p/pre/p3.pre) > results/v019w_trace47.log 2>&1
          python3 v019w/normalize_force_table.py results/v019w_force47_raw.dat results/v019w_force47.dat --json-out results/v019w_force47_stats.json

      - name: Trace N39 eta0 forcing p4
        shell: bash
        run: |
          set -euo pipefail
          (cd class_var && AEST_TANGENT_TRACE_FILE="$GITHUB_WORKSPACE/results/v019w_force39_p4_raw.dat" OMP_NUM_THREADS=1 ./class v019w_trace39_p4.ini ../v019v/pre/p4.pre) > results/v019w_trace39_p4.log 2>&1
          python3 v019w/normalize_force_table.py results/v019w_force39_p4_raw.dat results/v019w_force39_p4.dat --json-out results/v019w_force39_p4_stats.json

      - name: Run p3 variational lambda sequence
        shell: bash
        run: |
          set -euo pipefail
          FORCE="$GITHUB_WORKSPACE/results/v019w_force39.dat"
          run_case () {
            label="$1"; lam="$2"
            echo "=== ${label} lambda=${lam} p3 ==="
            (cd class_var && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="$lam" OMP_NUM_THREADS=1 ./class "v019w_${label}.ini" ../v019p/pre/p3.pre) > "results/v019w_${label}.log" 2>&1
          }
          run_case force_l0 0
          run_case force_p1 1
          run_case force_m1 -1
          run_case force_p10 10
          run_case force_m10 -10
          run_case force_p30 30
          run_case force_m30 -30

      - name: Run p4 lambda10 precision control
        shell: bash
        run: |
          set -euo pipefail
          FORCE="$GITHUB_WORKSPACE/results/v019w_force39_p4.dat"
          (cd class_var && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA=10 OMP_NUM_THREADS=1 ./class v019w_force_p10_p4.ini ../v019v/pre/p4.pre) > results/v019w_force_p10_p4.log 2>&1
          (cd class_var && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA=-10 OMP_NUM_THREADS=1 ./class v019w_force_m10_p4.ini ../v019v/pre/p4.pre) > results/v019w_force_m10_p4.log 2>&1

      - name: Analyse variational tangent
        run: |
          python3 v019w/analyse_v019w.py class_var/output \
            --force39 results/v019w_force39.dat \
            --force47 results/v019w_force47.dat \
            --force39-p4 results/v019w_force39_p4.dat \
            --json-out results/v019w_analysis.json

      - name: Create report
        run: python3 v019w/make_report.py

      - name: Upload debug results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v019w_debug_results
          path: results/

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v019w
          path: results_bundle_v019w.zip
          if-no-files-found: ignore
