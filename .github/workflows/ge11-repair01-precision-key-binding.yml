name: GE11 Repair01 precision key binding

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge11/repair01_predata_precision_key_binding.json'
      - 'ge11/pre/R1_repair01.pre'
      - 'ge11/pre/R2_repair01.pre'
      - 'ge11/repair01_dense_local_jet_fixed_refinement.py'
      - 'docs/ge11_repair01_precision_key_binding_implementation_lock.md'
      - '.github/workflows/ge11-repair01-precision-key-binding.yml'

jobs:
  repaired-fixed-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ge11/repair01_predata_precision_key_binding.json)" = "24fabf77ee957f2cbc825dc987ed38d3d40a6923"
          test "$(git rev-parse HEAD:ge11/pre/R1_repair01.pre)" = "7497e1a88cc15352641fcaacf7652ed6d6fb03f8"
          test "$(git rev-parse HEAD:ge11/pre/R2_repair01.pre)" = "63c3be3891a9b4178b179a3f728e72245ea63934"
          test "$(git rev-parse HEAD:ge11/repair01_dense_local_jet_fixed_refinement.py)" = "778e6a617af9f9584e4c1107f4c24bda561e6022"
          test "$(git rev-parse HEAD:docs/ge11_repair01_precision_key_binding_implementation_lock.md)" = "70fa794b32f7bb6461974c0e2aa4cba17902d602"
          test "$(git rev-parse HEAD:docs/ge11_dense_local_jet_fixed_refinement_result_freeze.md)" = "3882f54912ada367b0abf8c08cc6ba59c592fc21"
          test "$(git rev-parse HEAD:ge09/repair01_dense_accepted_step_local_jet_bridge.py)" = "509fa9d7bb323034bbf77b26792f35e1cc2ff7c7"
          git merge-base --is-ancestor 89d39bf9cd015d90cb76d60cf9a0ed324066a385 HEAD
          git merge-base --is-ancestor d6c65f47581be4afd2c86ca03a2a9cbea137aef4 HEAD
          git merge-base --is-ancestor 60e41a22f292c2300ce586c7e5c1419c7f29970e HEAD
          git merge-base --is-ancestor c60b7b28614080ff531b757e39308c5a40ecaa78 HEAD
          git merge-base --is-ancestor 5eafba759df91b556ede09b1ac9099f9452155cf HEAD
          echo GE11_REPAIR01_LOCK_PASS

      - name: Checkout pinned CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_ge11r1

      - name: Install Python dependencies
        run: python3 -m pip install --user numpy scipy

      - name: Active precision-key provenance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('class_ge11r1/include/precisions.h').read_text()
          assert 'class_precision_parameter(tol_perturbations_integration,double,1.0e-5)' in h
          assert 'class_precision_parameter(perturbations_sampling_stepsize,double,0.1)' in h
          r1=Path('ge11/pre/R1_repair01.pre').read_text()
          r2=Path('ge11/pre/R2_repair01.pre').read_text()
          assert 'tol_perturbations_integration = 2.5e-8' in r1
          assert 'perturbations_sampling_stepsize = 0.00125' in r1
          assert 'tol_perturbations_integration = 1.25e-8' in r2
          assert 'perturbations_sampling_stepsize = 0.000625' in r2
          for s in (r1,r2):
              assert 'tol_perturb_integration' not in s
              assert 'perturb_sampling_stepsize' not in s
          print('GE11_REPAIR01_ACTIVE_PRECISION_KEYS_PASS')
          PY

      - name: Apply validated AeST chain and diagnostic traces
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_ge11r1
          python3 v019i/apply_ic_patch.py class_ge11r1
          python3 v019j/apply_memory_patch.py class_ge11r1
          python3 v019w/apply_variational_forcing_patch.py class_ge11r1
          python3 v019y/apply_output_precision_patch.py class_ge11r1
          python3 v023/apply_source_grid_trace_patch.py class_ge11r1
          python3 tools/apply_v072_offline_trace_runtime_reload_patch.py class_ge11r1
          python3 tools/apply_v063_classy_runtime_reload_patch.py class_ge11r1
          python3 ge08/apply_full_state_trace_patch.py class_ge11r1
          python3 ge09/apply_dense_accepted_step_trace_patch.py class_ge11r1

      - name: Build CLASS executable
        shell: bash
        run: |
          set -euo pipefail
          make -C class_ge11r1 -j2 class

      - name: Predata implementation audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -m py_compile ge11/repair01_dense_local_jet_fixed_refinement.py
          python3 - <<'PY'
          import json
          d=json.load(open('ge11/repair01_predata_precision_key_binding.json'))
          assert d['classification']=='GE11_REPAIR01_PREDATA_PRECISION_KEY_BINDING'
          assert d['uses_new_physics'] is False
          assert d['uses_new_science_thresholds'] is False
          assert d['inherited_single_level_gates']['source_grid_state_validation_abs_or_rel_max']==1e-4
          assert d['refinement_gates']['R1_vs_R2_complete_jet_global_relative_L2_max']==5e-4
          assert d['refinement_gates']['R1_vs_R2_complete_jet_pointwise_abs_or_rel_max']==2e-3
          patch=json.load(open('results/ge09_dense_accepted_step_trace_patch.json'))
          assert patch['classification']=='GE09_DENSE_ACCEPTED_STEP_TRACE_PATCH_PASS'
          assert patch['physics_modified'] is False
          print('GE11_REPAIR01_PREDATA_IMPLEMENTATION_PASS')
          PY

      - name: Run GE11 Repair01
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 ge11/repair01_dense_local_jet_fixed_refinement.py             --class-root class_ge11r1             --json-out results/ge11_repair01_dense_local_jet_fixed_refinement.json             --npz-out results/ge11_repair01_dense_local_jet_fixed_refinement.npz             | tee results/ge11_repair01_dense_local_jet_fixed_refinement.log

      - name: Summarize GE11 Repair01
        if: always()
        shell: bash
        run: |
          if test -s results/ge11_repair01_dense_local_jet_fixed_refinement.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('results/ge11_repair01_dense_local_jet_fixed_refinement.json'))
          print('CLASSIFICATION=',d['classification'])
          print('PRECISION_BINDING=',d.get('precision_binding'))
          if 'levels' in d:
              for tag in ('R1','R2'):
                  r=d['levels'][tag]
                  print(tag,'TRACE=',r['accepted_points_per_k_in_window'],r['max_ln_a_gap_per_k_in_window'])
                  print(tag,'SOURCE=',r['source_grid_validation'])
                  print(tag,'JET=',r['jet_control'])
                  print(tag,'GATES=',r['gates'])
              print('REFINEMENT=',d['refinement_control'])
              print('REFINEMENT_GATES=',d['refinement_gates'])
              print('PROJECT_BOUNDARY=',d['project_boundary'])
          PY
          fi

      - name: Upload GE11 Repair01 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_ge11_repair01_precision_key_binding
          path: |
            results/ge11_repair01_dense_local_jet_fixed_refinement.json
            results/ge11_repair01_dense_local_jet_fixed_refinement.npz
            results/ge11_repair01_dense_local_jet_fixed_refinement.log
            results/ge11r1_R1_class.log
            results/ge11r1_R2_class.log
            results/ge11r1_R1_dense_accepted_step_trace.dat
            results/ge11r1_R2_dense_accepted_step_trace.dat
            results/ge11r1_R1_source_state_trace.dat
            results/ge11r1_R2_source_state_trace.dat
            results/ge11r1_R1_cli_perturbations_k*_s.dat
            results/ge11r1_R2_cli_perturbations_k*_s.dat
            ge11/repair01_predata_precision_key_binding.json
            ge11/pre/R1_repair01.pre
            ge11/pre/R2_repair01.pre
            docs/ge11_repair01_precision_key_binding_implementation_lock.md
          if-no-files-found: warn
