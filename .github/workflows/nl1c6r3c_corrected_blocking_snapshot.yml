name: NL1C6R3C corrected blocking snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6r3c_corrected_blocking_snapshot.yml'
      - 'nl1c6r3c/**'
      - 'docs/nl1c6r3c_*'

permissions:
  contents: read

concurrency:
  group: nl1c6r3c-corrected-blocking
  cancel-in-progress: false

jobs:
  blocking-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel
      - name: Build isolated corrected CLASS
        run: bash nl1c6d2n/setup_corrected_class_local.sh
      - name: Regenerate corrected baryon source
        run: bash nl1c5bc/run_local.sh
      - name: Run unchanged R3 solver on corrected blocking snapshot
        run: bash nl1c6r3c/run_local.sh
      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6R3C corrected blocking snapshot' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6r3c_corrected_blocking_snapshot.log ]]; then
            grep -E '^(SCREENED|MASS|CLASSIFICATION=|FULL_CORRECTED_R3_LICENSED=|index=)' results/nl1c6r3c_corrected_blocking_snapshot.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
