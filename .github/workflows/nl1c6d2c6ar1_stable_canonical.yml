name: NL1C6D2C6AR1 stable canonical variable

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c6ar1_stable_canonical.yml'
      - 'nl1c6d2c6ar1/**'
      - 'docs/nl1c6d2c6ar1_*'

permissions:
  contents: read

concurrency:
  group: nl1c6d2c6ar1-stable-canonical
  cancel-in-progress: false

jobs:
  stable-canonical-integrator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated corrected CLASS
        run: bash nl1c6d2n/setup_corrected_class_local.sh

      - name: Run stable canonical-variable integrator
        run: bash nl1c6d2c6ar1/run_local.sh

      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2C6AR1 stable canonical variable' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c6ar1_stable_canonical_integrator.log ]]; then
            grep -E '^(I[1-8]_|CLASSIFICATION=|D2C6B_|R1_)' results/nl1c6d2c6ar1_stable_canonical_integrator.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
