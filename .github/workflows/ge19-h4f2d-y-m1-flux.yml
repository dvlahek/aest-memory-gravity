name: GE19 H4F2d Y and M1 Mixed-Source Flux

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/h4f2d_predata_y_m1_flux_compatibility.json'
      - 'ge19/h4f2d_y_m1_action_flux_audit.py'
      - '.github/workflows/ge19-h4f2d-y-m1-flux.yml'

jobs:
  analytic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen source dependencies
        run: python3 -m pip install numpy scipy sympy
      - name: Verify exact action-flux and deterministic Fourier source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD:ge19/h4f2d_predata_y_m1_flux_compatibility.json)" = "902310e1e623cf65c3bdd5c5ecb199263558a39c"
          test "$(git rev-parse HEAD:ge19/h4f2d_y_m1_action_flux_audit.py)" = "c2e6d74ba332cd3b083cecce170fa0de1e8d3f61"
          python3 -m py_compile ge19/h4f2d_y_m1_action_flux_audit.py
          python3 -m ge19.h4f2d_y_m1_action_flux_audit \
            --json-out results/ge19_h4f2d_y_m1_action_flux.json \
            > results/ge19_h4f2d_y_m1_action_flux_FULL.log
          python3 - <<'PY'
          import json
          d=json.load(open("results/ge19_h4f2d_y_m1_action_flux.json"))
          assert d["classification"]=="GE19_H4F2D_Y_AND_M1_FLUX_SUBIDENTITY_PASS"
          assert d["all_subset_gates_pass"] is True
          assert all(b["exact"] for b in d["frozen_blobs"].values())
          assert all(d["source_code_bindings"].values())
          assert all(d["exact_symbolic"].values())
          assert len(d["deterministic_checks"]["Y_beta_cases"])==3
          assert max(x["Y_fourier_flux_identity_relative_defect"] for x in d["deterministic_checks"]["Y_beta_cases"])<=1e-12
          assert d["deterministic_checks"]["M1_fourier_flux_identity_relative_defect"]<=1e-12
          assert d["six_piece_H4_source_parent_Noether_derived"] is False
          assert d["H4_Z21_solve_performed"] is False
          assert d["Z21_certified"] is False
          print("GE19_H4F2D_Y_M1_FLUX_SUBIDENTITY_PASS")
          PY
          sha256sum results/ge19_h4f2d_y_m1_action_flux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge19_h4f2d_y_m1_action_flux
          path: |
            results/ge19_h4f2d_y_m1_action_flux.json
            results/ge19_h4f2d_y_m1_action_flux_FULL.log
          retention-days: 90
