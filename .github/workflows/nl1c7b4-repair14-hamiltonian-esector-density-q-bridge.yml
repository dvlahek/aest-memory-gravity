name: NL1C7B4 Repair14 Hamiltonian E-sector density-Q bridge audit

on:
  workflow_dispatch:
    inputs:
      repair08_artifact_id:
        description: 'Artifact containing Repair08 JSON and NPZ'
        required: true
        type: string
      repair10_artifact_id:
        description: 'Artifact containing Repair10 JSON'
        required: true
        type: string
      repair11_artifact_id:
        description: 'Artifact containing Repair11 JSON'
        required: true
        type: string
      repair12_artifact_id:
        description: 'Artifact containing Repair12 JSON'
        required: true
        type: string
      repair13_artifact_id:
        description: 'Artifact containing Repair13 JSON'
        required: true
        type: string
      repair13a_artifact_id:
        description: 'Artifact containing Repair13a JSON'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  repair14-density-q-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout locked harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy sympy

      - name: Verify Repair14 code lock
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 117d227737a1a78dfe5055878d703a90cbf74bd3 HEAD
          git merge-base --is-ancestor 517535978defec9d8ca04e289315d79b4acbc981 HEAD
          git merge-base --is-ancestor c44dc7687050dc560a9071e540dc0d7058238e0f HEAD
          git merge-base --is-ancestor cb6440383eac99001369e976fae035d74adf30fc HEAD
          git merge-base --is-ancestor 659809c331781beeec15066a44160879d28805c3 HEAD
          test "$(git rev-parse HEAD:docs/nl1c7b4_repair14_predata_hamiltonian_esector_density_q_bridge.md)" = "875aaef1b262811988b37f338119fc04fc0ad5ea"
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification_repair14.py)" = "c67aa9f8c64ba2dcb499216feb405a7a339b7b06"
          test "$(git rev-parse HEAD:docs/nl1c7b4_repair14_implementation_lock.md)" = "d5d5fd4213fc3254922e31af771259ac877c8bd5"
          test "$(git rev-parse HEAD:docs/nl1c7b4_repair13a_result_freeze.md)" = "914a8aed85a87d45496c9bd05e03be4bc37bbeba"
          test "$(git rev-parse HEAD:nl1c7b/run_local_nl1c7b4_repair14_hamiltonian_esector_density_q_bridge.sh)" = "f79a049a57d12374ea8015fbef606f4c0daae74d"
          echo NL1C7B4_REPAIR14_CODE_LOCK_PASS

      - name: Download frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
          R8_ARTIFACT_ID: ${{ inputs.repair08_artifact_id }}
          R10_ARTIFACT_ID: ${{ inputs.repair10_artifact_id }}
          R11_ARTIFACT_ID: ${{ inputs.repair11_artifact_id }}
          R12_ARTIFACT_ID: ${{ inputs.repair12_artifact_id }}
          R13_ARTIFACT_ID: ${{ inputs.repair13_artifact_id }}
          R13A_ARTIFACT_ID: ${{ inputs.repair13a_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/dense input/r8 input/r10 input/r11 input/r12 input/r13 input/r13a results
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10469031693/zip -o input/dense.zip
          unzip -q input/dense.zip -d input/dense
          for pair in "r8 ${R8_ARTIFACT_ID}" "r10 ${R10_ARTIFACT_ID}" "r11 ${R11_ARTIFACT_ID}" "r12 ${R12_ARTIFACT_ID}" "r13 ${R13_ARTIFACT_ID}" "r13a ${R13A_ARTIFACT_ID}"; do
            set -- ${pair}; tag="$1"; id="$2"
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/${id}/zip" -o "input/${tag}.zip"
            unzip -q "input/${tag}.zip" -d "input/${tag}"
          done
          mapfile -t r8j < <(find input/r8 -type f -name 'nl1c7a_repair08_identity_preserving_scalar_representation.json')
          mapfile -t r8n < <(find input/r8 -type f -name 'nl1c7a_repair08_identity_preserving_primary_states.npz')
          mapfile -t r10j < <(find input/r10 -type f -name 'nl1c7b4_repair10_raw_source_localization.json')
          mapfile -t r11j < <(find input/r11 -type f -name 'nl1c7b4_repair11_esector_analytic_covariant_audit.json')
          mapfile -t r12j < <(find input/r12 -type f -name 'nl1c7b4_repair12_full_constraint_order_audit.json')
          mapfile -t r13j < <(find input/r13 -type f -name 'nl1c7b4_repair13_hamiltonian_first_order_source_localization.json')
          mapfile -t r13aj < <(find input/r13a -type f -name 'nl1c7b4_repair13a_roundoff_stable_source_localization.json')
          test "${#r8j[@]}" -eq 1; test "${#r8n[@]}" -eq 1; test "${#r10j[@]}" -eq 1; test "${#r11j[@]}" -eq 1; test "${#r12j[@]}" -eq 1; test "${#r13j[@]}" -eq 1; test "${#r13aj[@]}" -eq 1
          cp "${r8j[0]}" results/nl1c7a_repair08_identity_preserving_scalar_representation.json
          cp "${r8n[0]}" results/nl1c7a_repair08_identity_preserving_primary_states.npz
          cp "${r10j[0]}" results/nl1c7b4_repair10_raw_source_localization.json
          cp "${r11j[0]}" results/nl1c7b4_repair11_esector_analytic_covariant_audit.json
          cp "${r12j[0]}" results/nl1c7b4_repair12_full_constraint_order_audit.json
          cp "${r13j[0]}" results/nl1c7b4_repair13_hamiltonian_first_order_source_localization.json
          cp "${r13aj[0]}" results/nl1c7b4_repair13a_roundoff_stable_source_localization.json
          test "$(sha256sum results/nl1c7a_repair08_identity_preserving_scalar_representation.json | awk '{print $1}')" = "054851decab71e79a05aca2bc9fb287bb1239c8fb425989f40920004c3d88453"
          test "$(sha256sum results/nl1c7a_repair08_identity_preserving_primary_states.npz | awk '{print $1}')" = "4639f3b5c0afcddb2f98c8b9f6a9dbbf8661dac685b12d235c09075a106dafa7"
          test "$(sha256sum results/nl1c7b4_repair10_raw_source_localization.json | awk '{print $1}')" = "f1fc1a86d2d488f5e88f0d32b0d3d1d5ce9dab22f52e51fa69801948aeb6de9d"
          test "$(sha256sum results/nl1c7b4_repair11_esector_analytic_covariant_audit.json | awk '{print $1}')" = "48c8caf0c5758b089318bcd18885c87725bc244ed5a47862ac841b37b834742d"
          test "$(sha256sum results/nl1c7b4_repair12_full_constraint_order_audit.json | awk '{print $1}')" = "99c963dc65cca35c90c6b892fb4192bed1a8c03776664c9da532a5702c62767c"
          test "$(sha256sum results/nl1c7b4_repair13_hamiltonian_first_order_source_localization.json | awk '{print $1}')" = "ef6791edd595a2bd8b44e52a703915385a1e2c4d98345ff4cc509a5d22a61a9b"
          test "$(sha256sum results/nl1c7b4_repair13a_roundoff_stable_source_localization.json | awk '{print $1}')" = "cad6cb2b49b3b20a0b6346390f8536fb90da8d5000ceed82ac0de86b912679b3"

      - name: Execute locked Repair14
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash nl1c7b/run_local_nl1c7b4_repair14_hamiltonian_esector_density_q_bridge.sh 2>&1 | tee results/nl1c7b4_repair14_runner.log
          rc=$?
          set -e
          echo "SCIENCE_RC=${rc}"
          test "${rc}" -eq 0 -o "${rc}" -eq 2

      - name: Verify terminal classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c7b4_repair14_hamiltonian_esector_density_q_bridge.json'))
          assert d['classification'] in {
            'NL1C7B4_REPAIR14_DENSITY_Q_BRIDGE_OMISSION_IDENTIFIED',
            'NL1C7B4_REPAIR14_HAMILTONIAN_ESECTOR_INTERFACE_MISMATCH',
            'NL1C7B4_REPAIR14_IMPLEMENTATION_FAIL'}
          if d['classification'].endswith('_IDENTIFIED'): assert all(d['gates'].values())
          assert d['claim_boundary']['historical_B4_fail_preserved'] is True
          print(d['classification'])
          PY

      - name: Upload Repair14 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c7b4_repair14_density_q_bridge
          path: |
            results/nl1c7b4_repair14_hamiltonian_esector_density_q_bridge.json
            results/nl1c7b4_repair14_hamiltonian_esector_density_q_bridge.log
            results/nl1c7b4_repair14_runner.log
          if-no-files-found: warn
