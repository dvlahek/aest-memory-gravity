name: NL1C5 screened quasistatic reclosure

on:
  push:
    branches: [v053-model-freeze-planck]
    paths:
      - 'docs/nl1c5_predata_screened_quasistatic_reclosure.md'
      - 'nl1c5/**'
      - '.github/workflows/nl1c5-screened-quasistatic-reclosure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  V077_ARTIFACT_ID: '10090367181'
  V077_ARTIFACT_SHA256: '24b97e5738eb07be4f12d433ff5f9fe22249e199e186d5617aca5dc81f748378'

jobs:
  nl1c5-screened-quasistatic-reclosure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Predata audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('docs/nl1c5_predata_screened_quasistatic_reclosure.md').read_text()
          required=[
            'NL1C5_PREDATA_SCREENED_QUASISTATIC_RECLOSURE',
            'NL1C4_EXPANDING_MEMORY_SOURCE_TRAJECTORY_PASS',
            'NL1C5_SCREENED_RECLOSURE_TRANSITION_REQUIRES_FULL_J',
            'NL1C5_SCREENED_MEMORY_SOURCE_SURVIVES',
            'NL1C5_SCREENED_MEMORY_SOURCE_SUPPRESSED',
            'NL1C5_SCREENED_QUASISTATIC_RECLOSURE_PASS',
            'published AeST screened Helmholtz closure, not a GR/Poisson substitute',
            'at **every native time used to integrate the retarded bath**'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('NL1C5_PREDATA_AUDIT_PASS')
          PY

      - name: Download and verify preserved v0.77 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/v077
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$V077_ARTIFACT_ID/zip" \
            -o input/v077.zip
          echo "$V077_ARTIFACT_SHA256  input/v077.zip" | sha256sum -c -
          unzip -q input/v077.zip -d input/v077
          test -s input/v077/v077_native_state_tangent_affinity.npz
          test -s input/v077/v076_v077_base_trace.dat
          echo V077_ARTIFACT_AUDIT_PASS

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Syntax check
        run: python3 -m py_compile nl1c5/screened_quasistatic_reclosure.py

      - name: Run NL1C5 reclosure
        run: |
          python3 nl1c5/screened_quasistatic_reclosure.py \
            --npz input/v077/v077_native_state_tangent_affinity.npz \
            --trace input/v077/v076_v077_base_trace.dat \
            --json-out results/nl1c5_screened_quasistatic_reclosure.json

      - name: Verify honest classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c5_screened_quasistatic_reclosure.json'))
          allowed={
            'NL1C5_SCREENED_QUASISTATIC_RECLOSURE_FAIL',
            'NL1C5_SCREENED_RECLOSURE_TRANSITION_REQUIRES_FULL_J',
            'NL1C5_SCREENED_QUASISTATIC_RECLOSURE_PASS'
          }
          assert d['classification'] in allowed
          assert d['physical_eta']==0.0
          assert d['uses_observational_data'] is False
          assert d['historical_results_unchanged'] is True
          if d['classification']=='NL1C5_SCREENED_RECLOSURE_TRANSITION_REQUIRES_FULL_J':
              assert d['memory_source_survival_test_executed'] is False
          print(d['classification'])
          print(d['diagnosis'])
          PY

      - name: Upload NL1C5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c5_screened_quasistatic_reclosure
          path: |
            results/nl1c5_screened_quasistatic_reclosure.json
            docs/nl1c5_predata_screened_quasistatic_reclosure.md
            nl1c5/screened_quasistatic_reclosure.py
