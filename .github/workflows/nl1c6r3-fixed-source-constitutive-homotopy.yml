name: NL1C6R3 fixed-source constitutive homotopy repair

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NL1C5B_ARTIFACT_ID: '10101422385'
  NL1C5B_ARTIFACT_SHA256: '0ab60cbc32210ad3fb75c881f91a9db11148280e9223ea644680ed8cdfbaa590'

jobs:
  nl1c6r3-fixed-source-constitutive-homotopy:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy

      - name: Predata audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('docs/nl1c6r3_predata_fixed_source_constitutive_homotopy.md').read_text()
          required=[
            'NL1C6R3_PREDATA_FIXED_SOURCE_CONSTITUTIVE_HOMOTOPY',
            'NL1C6R2_FULL_J_BARYONIC_RECLOSURE_FAIL',
            '10108738796',
            '74fd5007cb12413baf1011de155b23437f3bbd1db140bfbd472af6a81c47d9cb',
            'j_S(theta,x)',
            'j_M(theta,x)',
            'theta1 in {2^-8, 2^-10, 2^-12, 2^-14, 2^-16, 2^-18, 2^-20, 2^-22, 2^-24, 2^-26, 2^-28, 2^-30}',
            'initial `ds=1e-2`',
            'minimum `ds=1e-8`',
            'maximum `ds=1e-1`',
            'bordered preconditioner',
            '10101422385',
            '0ab60cbc32210ad3fb75c881f91a9db11148280e9223ea644680ed8cdfbaa590',
            'NL1C6R3_FULL_J_BARYONIC_RECLOSURE_PASS',
            'NL1C6R3_FULL_J_MULTIBRANCH_REQUIRES_BOUNDARY_SELECTION',
            'NL1C6R3_FULL_J_BARYONIC_RECLOSURE_FAIL'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('NL1C6R3_PREDATA_AUDIT_PASS')
          PY

      - name: Download and verify NL1C5B baryon-source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/nl1c5b
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$NL1C5B_ARTIFACT_ID/zip" \
            -o input/nl1c5b.zip
          echo "$NL1C5B_ARTIFACT_SHA256  input/nl1c5b.zip" | sha256sum -c -
          unzip -q input/nl1c5b.zip -d input/nl1c5b
          npz=$(find input/nl1c5b -type f -name 'nl1c5b_baryon_source_freeze.npz' -print -quit)
          test -n "$npz"
          test -s "$npz"
          echo "NL1C5B_NPZ=$npz" >> "$GITHUB_ENV"
          echo NL1C6R3_NL1C5B_IDENTITY_PASS

      - name: Syntax check
        run: |
          python3 -m py_compile nl1c6/full_j_baryonic_reclosure.py
          python3 -m py_compile nl1c6r3/fixed_source_constitutive_homotopy.py

      - name: Endpoint identity smoke check
        run: |
          python3 - <<'PY'
          import numpy as np
          from nl1c6 import full_j_baryonic_reclosure as b
          from nl1c6r3 import fixed_source_constitutive_homotopy as r3
          n=256; a=1/7; beta=1.0; kind='simple'
          x=np.arange(n)*b.BOX/n
          chi=1e-7*np.cos(2*np.pi*3*x/b.BOX)+2e-8*np.sin(2*np.pi*5*x/b.BOX)
          rhs=3e-9*np.cos(2*np.pi*3*x/b.BOX); rhs-=rhs.mean()
          rb=b.residual_state(chi,rhs,a,beta,kind)[0]
          for route in ('screened','mass'):
              rr=r3.residual_theta(chi,rhs,a,beta,kind,1.0,route)[0]
              err=np.linalg.norm(rr-rb)/max(np.linalg.norm(rb),1e-300)
              print(route,err)
              assert err < 1e-13
          print('NL1C6R3_THETA1_ENDPOINT_IDENTITY_PASS')
          PY

      - name: Run preregistered NL1C6R3 repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          set +e
          python3 nl1c6r3/fixed_source_constitutive_homotopy.py \
            --input-npz "$NL1C5B_NPZ" \
            --input-zip-sha256 "$NL1C5B_ARTIFACT_SHA256" \
            --json-out results/nl1c6r3_full_j_baryonic_reclosure.json \
            --npz-out results/nl1c6r3_full_j_baryonic_reclosure.npz \
            > results/nl1c6r3_stdout.log 2>&1
          status=$?
          set -e
          cat results/nl1c6r3_stdout.log
          echo "NL1C6R3_PROCESS_EXIT_CODE=$status"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          test -s results/nl1c6r3_full_j_baryonic_reclosure.json
          test -s results/nl1c6r3_full_j_baryonic_reclosure.npz

      - name: Verify honest classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c6r3_full_j_baryonic_reclosure.json'))
          allowed={
            'NL1C6R3_FULL_J_BARYONIC_RECLOSURE_PASS',
            'NL1C6R3_FULL_J_MULTIBRANCH_REQUIRES_BOUNDARY_SELECTION',
            'NL1C6R3_FULL_J_BARYONIC_RECLOSURE_FAIL'
          }
          assert d['classification'] in allowed, d['classification']
          assert d['historical_results_unchanged'] is True
          assert d['repair']['physical_equations_changed'] is False
          assert d['repair']['physical_gates_changed'] is False
          assert d['repair']['source_amplitude_at_endpoint']==1.0
          assert d['repair']['historical_NL1C6R2_classification']=='NL1C6R2_FULL_J_BARYONIC_RECLOSURE_FAIL'
          assert d['physical_eta']==0.0
          assert d['memory_source_evaluated'] is False
          print(d['classification'])
          print(json.dumps(d['gates'],sort_keys=True))
          print(json.dumps(d['global_metrics'],sort_keys=True))
          print('anchor_multibranch_found=',d['anchor_multibranch_found'])
          print('anchor_max_lowmode_difference=',d['anchor_max_lowmode_difference'])
          PY

      - name: Upload NL1C6R3 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c6r3_fixed_source_constitutive_homotopy
          path: |
            results/nl1c6r3_full_j_baryonic_reclosure.json
            results/nl1c6r3_full_j_baryonic_reclosure.npz
            results/nl1c6r3_stdout.log
            docs/nl1c6r3_predata_fixed_source_constitutive_homotopy.md
            docs/nl1c6r2_pseudo_arclength_repair_result.md
            nl1c6r3/fixed_source_constitutive_homotopy.py
            nl1c6/full_j_baryonic_reclosure.py
          if-no-files-found: warn
