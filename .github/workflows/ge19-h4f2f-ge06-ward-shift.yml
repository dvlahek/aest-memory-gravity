name: GE19 H4F2f GE06 Coframe Ward and Mixed Shift Source

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/h4f2f_predata_ge06_shift_ward_mixed_source.json'
      - 'ge19/h4f2f_ge06_shift_ward_mixed_source_audit.py'
      - '.github/workflows/ge19-h4f2f-ge06-ward-shift.yml'

jobs:
  symbolic-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen GE19 symbolic and source dependencies
        run: python3 -m pip install numpy scipy sympy
      - name: Verify frozen GE06 coframe source without H4/Z21 propagation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD:ge19/h4f2f_predata_ge06_shift_ward_mixed_source.json)" = "551294c5763b086919c9f27076a922c29ca953e5"
          test "$(git rev-parse HEAD:ge19/h4f2f_ge06_shift_ward_mixed_source_audit.py)" = "49e7546e5ccb76d27436486f8baddd2a4d17956e"
          python3 -m py_compile ge19/h4f2f_ge06_shift_ward_mixed_source_audit.py
          python3 -m ge19.h4f2f_ge06_shift_ward_mixed_source_audit \
            --json-out results/ge19_h4f2f_ge06_shift_ward_mixed_source.json \
            > results/ge19_h4f2f_ge06_shift_ward_mixed_source_FULL.log
          python3 - <<'PY'
          import json
          p="results/ge19_h4f2f_ge06_shift_ward_mixed_source.json"
          d=json.load(open(p))
          assert d["classification"]=="GE19_H4F2F_GE06_SPATIAL_WARD_SHIFT_SOURCE_SUBSET_PASS"
          assert d["all_subset_gates_pass"] is True
          assert all(v["exact"] for v in d["frozen_blobs"].values())
          assert all(d["full_unreduced_coframe_jet_spatial_ward"].values())
          assert all(d["frozen_action_and_source_implementation_bindings"].values())
          assert all(all(x.values()) for x in d["exact_independent_shift_local_mixed_action_partials"].values())
          assert all(all(x.values()) for x in d["source_only_frozen_generator_numeric"].values())
          assert d["full_six_piece_H4_source_parent_Noether_derived"] is False
          assert d["H4_Z21_solve_performed"] is False
          assert d["Z21_certified"] is False
          print("GE19_H4F2F_GE06_SHIFT_ACTION_SUBSET_PASS")
          PY
          sha256sum results/ge19_h4f2f_ge06_shift_ward_mixed_source.json
          wc -c results/ge19_h4f2f_ge06_shift_ward_mixed_source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge19_h4f2f_ge06_shift_ward_mixed_source
          path: |
            results/ge19_h4f2f_ge06_shift_ward_mixed_source.json
            results/ge19_h4f2f_ge06_shift_ward_mixed_source_FULL.log
          retention-days: 90
