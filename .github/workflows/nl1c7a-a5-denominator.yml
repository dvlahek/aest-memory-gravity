name: NL1C7A A5 finite growing-mode denominator

on:
  push:
    branches: [nl1c7a-growing-mode-bridge]
    paths:
      - '.github/workflows/nl1c7a-a5-denominator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  a5-denominator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy

      - name: Verify frozen A5 locks and parent A4 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a84844bba48db427701ef5b406bc1f7751b5ebca HEAD
          test "$(git rev-parse HEAD:nl1c7a/a5_denominator_audit.py)" = "47b486ca2defbd1db029df003b37909a9d4d170d"
          run_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/runs/35104087182)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["conclusion"]=="success"; assert d["head_sha"]=="0762723606536b58b7db39d41608fcaefe8eebd4"' <<<"${run_json}"
          art_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10450205501)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["digest"]=="sha256:9b1a4f998af55ce594cbdd6db78b9b99944cd25a3f690c68bab49ffef290ffc6"; assert d["expired"] is False' <<<"${art_json}"
          echo NL1C7A_A5_LOCKS_AND_PARENT_A4_PROVENANCE_PASS

      - name: Download frozen Repair05 A4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/a4
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10450205501/zip \
            -o input/a4.zip
          unzip -q input/a4.zip -d input/a4
          test -s input/a4/nl1c7a_extended_source_trace.dat
          test -s input/a4/nl1c7a_trace_coverage.json

      - name: Run frozen A5 denominator audit
        shell: bash
        run: |
          set -euo pipefail
          python3 nl1c7a/a5_denominator_audit.py \
            --trace input/a4/nl1c7a_extended_source_trace.dat \
            --coverage-json input/a4/nl1c7a_trace_coverage.json \
            --out results/nl1c7a_a5_denominator.json \
            2>&1 | tee results/nl1c7a_a5_denominator.log

      - name: Verify A5 classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c7a_a5_denominator.json'))
          assert d['classification']=='NL1C7A_A5_FINITE_GROWING_MODE_DENOMINATOR_PASS'
          assert all(d['gates'].values())
          assert d['global_min_primary_minabs_over_maxabs'] >= 1e-12
          print('NL1C7A_A5_FINITE_GROWING_MODE_DENOMINATOR_PASS')
          PY

      - name: Upload A5 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c7a_a5_denominator
          path: |
            results/nl1c7a_a5_denominator.json
            results/nl1c7a_a5_denominator.log
          if-no-files-found: warn
