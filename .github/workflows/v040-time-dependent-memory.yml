name: v040 locked-KB time-dependent memory generality

on:
  workflow_dispatch:
  push:
    paths:
      - 'v040/**'
      - '.github/workflows/v040-time-dependent-memory.yml'

jobs:
  time-dependent-memory:
    strategy:
      fail-fast: false
      matrix:
        p: [0.0, 0.5, 1.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v040
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v040/output
          python3 v019/apply_patch_v019.py class_v040
          python3 v019i/apply_ic_patch.py class_v040
          python3 v019j/apply_memory_patch.py class_v040
          python3 v019w/apply_variational_forcing_patch.py class_v040
          python3 v019y/apply_output_precision_patch.py class_v040
          python3 v023/apply_source_grid_trace_patch.py class_v040
      - name: Build CLASS
        run: make -C class_v040 -j2 class
      - name: Source audit
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v040/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v040/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v040/include/common.h
      - name: Prepare locked KB=0.0665 time-dependent case
        shell: bash
        run: |
          set -euo pipefail
          P='${{ matrix.p }}'; TAU0='10.0'
          TAG=$(python3 v040/prepare_time_dependent_case.py class_v040 --p "$P" --tau0H0 "$TAU0" --meta "results/v040_meta_p${P}.json" | tail -1)
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "P=$P" >> "$GITHUB_ENV"; echo "TAU0=$TAU0" >> "$GITHUB_ENV"; echo "KB=0.0665" >> "$GITHUB_ENV"
      - name: Run locked candidate and matched KB=0.1 reference
        shell: bash
        run: |
          set -euo pipefail
          (cd class_v040 && AEST_OFFLINE_TRACE_FILE="$GITHUB_WORKSPACE/results/v040_${TAG}_trace.dat" OMP_NUM_THREADS=1 ./class "v040_${TAG}_base.ini" ../v019p/pre/p3.pre) > "results/v040_${TAG}_base.log" 2>&1
          (cd class_v040 && OMP_NUM_THREADS=1 ./class "v040_${TAG}_ref.ini" ../v019p/pre/p3.pre) > "results/v040_${TAG}_ref.log" 2>&1
          test -s "results/v040_${TAG}_trace.dat"
      - name: Build accepted-grid time-dependent positive Drude forcing
        shell: bash
        run: |
          set -euo pipefail
          python3 v040/build_time_dependent_tau_forcing.py "results/v040_${TAG}_trace.dat" --KB "$KB" --tau0H0 "$TAU0" --p "$P" --out-prefix "results/v040_${TAG}" --control-order 512 --primary-order 1024 --summary "results/v040_${TAG}_forcing.json"
      - name: Run six nuisance directions
        shell: bash
        run: |
          set -euo pipefail
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            (cd class_v040 && OMP_NUM_THREADS=1 ./class "v040_${TAG}_nuis_${q}_p.ini" ../v019p/pre/p3.pre) > "results/v040_${TAG}_nuis_${q}_p.log" 2>&1 & a=$!
            (cd class_v040 && OMP_NUM_THREADS=1 ./class "v040_${TAG}_nuis_${q}_m.ini" ../v019p/pre/p3.pre) > "results/v040_${TAG}_nuis_${q}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Run full lambda ladder
        shell: bash
        run: |
          set -euo pipefail
          FORCE="$GITHUB_WORKSPACE/results/v040_${TAG}_force.dat"
          for L in 1 3 10 30 100 300 1000; do
            (cd class_v040 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="$L" OMP_NUM_THREADS=1 ./class "v040_${TAG}_l${L}_p.ini" ../v019p/pre/p3.pre) > "results/v040_${TAG}_l${L}_p.log" 2>&1 & a=$!
            (cd class_v040 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="-$L" OMP_NUM_THREADS=1 ./class "v040_${TAG}_l${L}_m.ini" ../v019p/pre/p3.pre) > "results/v040_${TAG}_l${L}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Analyse time-dependent memory response
        shell: bash
        run: |
          set -euo pipefail
          python3 v039/analyse_tau_generality.py class_v040/output --tag "$TAG" --kb "$KB" --tauH0 "$TAU0" --prefix v040 --force-control "results/v040_${TAG}_force_control.dat" --force-primary "results/v040_${TAG}_force.dat" --json-out "results/v040_${TAG}_analysis.json"
          python3 - <<'PY'
          import json,glob,os,math
          p=float(os.environ['P']); fs=glob.glob('results/v040_*_analysis.json'); assert len(fs)==1
          q=json.load(open(fs[0])); q['p']=p; q['tau0H0']=10.0; q['tau_law']='tau_eff*H0=tau0H0*(H/H0)^(-p)'
          if p==0.0:
              target=0.1364941527698679; got=q['memory_candidate_covariance']['marginalized_CV_SNR_per_unit_eta']; rel=abs(got-target)/target
              q['p0_v039_regression_relative_difference']=rel; q['p0_v039_regression_gate']=rel<1e-10
              if not q['p0_v039_regression_gate']: raise SystemExit('p=0 failed exact v0.39 regression')
          open(fs[0],'w').write(json.dumps(q,indent=2))
          PY
      - name: Upload v0.40 result
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v040_p_${{ matrix.p }}
          path: |
            results/v040_*_analysis.json
            results/v040_*_forcing.json
            results/v040_meta_*.json
            results/v023_trace_patch.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v040_debug_p_${{ matrix.p }}
          path: |
            results/*.json
            results/*.log
