name: v039 locked-KB tau-generality scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'v039/**'
      - '.github/workflows/v039-tau-generality.yml'

jobs:
  tau-generality:
    strategy:
      fail-fast: false
      matrix:
        tauH0: [1.0, 3.0, 10.0]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v039
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v039/output
          python3 v019/apply_patch_v019.py class_v039
          python3 v019i/apply_ic_patch.py class_v039
          python3 v019j/apply_memory_patch.py class_v039
          python3 v019w/apply_variational_forcing_patch.py class_v039
          python3 v019y/apply_output_precision_patch.py class_v039
          python3 v023/apply_source_grid_trace_patch.py class_v039
      - name: Build CLASS
        run: make -C class_v039 -j2 class
      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v039/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v039/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v039/include/common.h
      - name: Prepare locked KB=0.0665 tau case
        shell: bash
        run: |
          set -euo pipefail
          TAU='${{ matrix.tauH0 }}'
          TAG=$(python3 v039/prepare_locked_tau_case.py class_v039 --tauH0 "$TAU" --meta "results/v039_meta_tau${TAU}.json" | tail -1)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TAU=$TAU" >> "$GITHUB_ENV"
          echo "KB=0.0665" >> "$GITHUB_ENV"
      - name: Run locked candidate and matched KB=0.1 reference
        shell: bash
        run: |
          set -euo pipefail
          (cd class_v039 && AEST_OFFLINE_TRACE_FILE="$GITHUB_WORKSPACE/results/v039_${TAG}_trace.dat" OMP_NUM_THREADS=1 ./class "v039_${TAG}_base.ini" ../v019p/pre/p3.pre) > "results/v039_${TAG}_base.log" 2>&1
          (cd class_v039 && OMP_NUM_THREADS=1 ./class "v039_${TAG}_ref.ini" ../v019p/pre/p3.pre) > "results/v039_${TAG}_ref.log" 2>&1
          test -s "results/v039_${TAG}_trace.dat"
      - name: Build accepted-grid positive Drude forcing
        shell: bash
        run: |
          set -euo pipefail
          python3 v039/build_tau_forcing.py "results/v039_${TAG}_trace.dat" --KB "$KB" --tauH0 "$TAU" --out-prefix "results/v039_${TAG}" \
            --control-order 512 --primary-order 1024 --summary "results/v039_${TAG}_forcing.json"
      - name: Run six nuisance directions at locked refitted point
        shell: bash
        run: |
          set -euo pipefail
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            (cd class_v039 && OMP_NUM_THREADS=1 ./class "v039_${TAG}_nuis_${q}_p.ini" ../v019p/pre/p3.pre) > "results/v039_${TAG}_nuis_${q}_p.log" 2>&1 & a=$!
            (cd class_v039 && OMP_NUM_THREADS=1 ./class "v039_${TAG}_nuis_${q}_m.ini" ../v019p/pre/p3.pre) > "results/v039_${TAG}_nuis_${q}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Run full lambda ladder
        shell: bash
        run: |
          set -euo pipefail
          FORCE="$GITHUB_WORKSPACE/results/v039_${TAG}_force.dat"
          for L in 1 3 10 30 100 300 1000; do
            (cd class_v039 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="$L" OMP_NUM_THREADS=1 ./class "v039_${TAG}_l${L}_p.ini" ../v019p/pre/p3.pre) > "results/v039_${TAG}_l${L}_p.log" 2>&1 & a=$!
            (cd class_v039 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="-$L" OMP_NUM_THREADS=1 ./class "v039_${TAG}_l${L}_m.ini" ../v019p/pre/p3.pre) > "results/v039_${TAG}_l${L}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Analyse tau-generality response
        shell: bash
        run: |
          set -euo pipefail
          python3 v039/analyse_tau_generality.py class_v039/output --tag "$TAG" --kb "$KB" --tauH0 "$TAU" --prefix v039 \
            --force-control "results/v039_${TAG}_force_control.dat" --force-primary "results/v039_${TAG}_force.dat" \
            --json-out "results/v039_${TAG}_analysis.json"
      - name: Upload v0.39 result
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v039_tauH0_${{ matrix.tauH0 }}
          path: |
            results/v039_*_analysis.json
            results/v039_*_forcing.json
            results/v039_meta_*.json
            results/v023_trace_patch.json
      - name: Upload v0.39 debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v039_debug_tauH0_${{ matrix.tauH0 }}
          path: |
            results/*.json
            results/*.log
