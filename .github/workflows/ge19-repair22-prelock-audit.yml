name: GE19 Repair22 Z20 certification prelock

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/repair22_*'
      - '.github/workflows/ge19-repair22-prelock-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install numpy scipy sympy

      - name: Compile
        run: python3 -m py_compile ge19/repair22_on_shell_parent_z20_certification.py

      - name: Audit frozen certification contract
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, subprocess
          from pathlib import Path
          import numpy as np

          root=Path.cwd()
          pre=json.load(open("ge19/repair22_predata_on_shell_parent_z20_certification.json"))
          assert pre["classification"]=="GE19_REPAIR22_PREDATA_ON_SHELL_PARENT_Z20_CERTIFICATION"
          assert pre["created_before_repair22_result"] is True
          assert pre["parent_repair21_freeze_commit"]=="a6fea1e32aebef65e43151030fe90fc6263d6ce0"
          assert pre["primary_control"]["Nt_primary"]==128
          assert pre["primary_control"]["Nt_control"]==64
          assert pre["primary_control"]["Nx_primary"]==1024
          assert pre["primary_control"]["Nx_source_control"]==2048
          assert pre["H3"]["source_spatial_gate"]==5e-4
          assert pre["H3"]["linear_system_gate"]==1e-8
          assert pre["H3"]["anisotropy_gate"]==1e-6
          assert pre["H3"]["state_time_gate"]==5e-3
          assert pre["shift_certification"]["active_shift_backward_error_max"]==1e-6
          assert pre["shift_certification"]["matched_active_Linf_order_min"]==2.5
          assert pre["shift_certification"]["matched_active_L2_order_min"]==2.5
          assert pre["shift_certification"]["original_all_row_metric_reported_not_gated"] is True

          def blob(path):
              return subprocess.check_output(["git","rev-parse",f"HEAD:{path}"],text=True).strip()

          assert blob("ge19/repair07_window_retarded_reduced_h3_z20_particular.py")=="e34d28a2062c748f48bc82fa928844b02631de25"
          assert blob("ge19/repair13_self_consistent_reduced_background_h1_reclosure.py")=="362d63d03d7b850fceae393f535353ded79aeea7"
          assert blob("ge19/repair14_self_consistent_reduced_h3_z20_particular.py")=="06c5ced952c2370cfa4aaadb6ef8f72d2d7221de"
          assert blob("ge19/repair18_zero_coordinate_constraint_projected_momentum_boundary.py")=="c7b3a5c689bd78a65a8150c26e1fbfae108cb580"
          assert blob("ge19/repair21_on_shell_h1_parent_matched_shift_audit.py")=="73e7fa0f5b3a58f0462308bf11d2a53b7616abfb"

          spec=importlib.util.spec_from_file_location(
              "r22",root/"ge19/repair22_on_shell_parent_z20_certification.py"
          )
          r22=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r22)

          assert r22.SOURCE_SPATIAL_MAX==5e-4
          assert r22.LINEAR_MAX==1e-8
          assert r22.SHIFT_ACTIVE_MAX==1e-6
          assert r22.ANISO_MAX==1e-6
          assert r22.STATE_MAX==5e-3
          assert r22.ORDER_MIN==2.5
          assert r22.NEAR_NULL_RATIO_MAX==1000*np.finfo(float).eps

          src=(root/"ge19/repair22_on_shell_parent_z20_certification.py").read_text()
          assert "r21.main()" in src
          assert "r7.NX_PRIMARY" in src
          assert "r7.NX_SPATIAL_CONTROL" in src
          assert "source_bundle_reduced_lambda(" in src
          assert "projected_momentum_solve(" in src
          assert "original_all_row_metric_is_report_only" in src
          assert 'matched["Nt128_active_Linf"]<=SHIFT_ACTIVE_MAX' in src.replace(" ","")
          assert 'matched["observed_order_Linf"]>=ORDER_MIN' in src.replace(" ","")
          assert 'matched["observed_order_L2"]>=ORDER_MIN' in src.replace(" ","")
          assert "Z20_certified" in src

          for token in [
              "def lambda_c2_equation_source",
              "def source_real_reduced_lambda",
              "def y2_source_from_reduced",
          ]:
              assert token not in src, token

          print("REPAIR07_BLOB =",blob("ge19/repair07_window_retarded_reduced_h3_z20_particular.py"))
          print("REPAIR13_BLOB =",blob("ge19/repair13_self_consistent_reduced_background_h1_reclosure.py"))
          print("REPAIR14_BLOB =",blob("ge19/repair14_self_consistent_reduced_h3_z20_particular.py"))
          print("REPAIR18_BLOB =",blob("ge19/repair18_zero_coordinate_constraint_projected_momentum_boundary.py"))
          print("REPAIR21_BLOB =",blob("ge19/repair21_on_shell_h1_parent_matched_shift_audit.py"))
          print("GE19_REPAIR22_PRELOCK_AUDIT_PASS")
          PY
