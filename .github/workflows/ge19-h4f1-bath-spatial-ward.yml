name: GE19 H4F1 NL0B Bath Covector Spatial Ward

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/h4f1_predata_longitudinal_bath_spatial_ward.json'
      - 'ge19/h4f1_longitudinal_bath_spatial_ward_audit.py'
      - '.github/workflows/ge19-h4f1-bath-spatial-ward.yml'

jobs:
  symbolic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic dependency
        run: python3 -m pip install sympy
      - name: Exact frozen coframe, covector and memory density transformation gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD:ge19/h4f1_predata_longitudinal_bath_spatial_ward.json)" = "7f26852707ba5b722adf0c934003b2cc5cccb24b"
          test "$(git rev-parse HEAD:ge19/h4f1_longitudinal_bath_spatial_ward_audit.py)" = "a3f0b8e2d466a6421b9292ea841e0508854fe023"
          python3 -m py_compile ge19/h4f1_longitudinal_bath_spatial_ward_audit.py
          python3 -m ge19.h4f1_longitudinal_bath_spatial_ward_audit \
            --json-out results/ge19_h4f1_longitudinal_bath_spatial_ward.json \
            > results/ge19_h4f1_longitudinal_bath_spatial_ward_FULL.log
          python3 - <<'PY'
          import json
          d=json.load(open("results/ge19_h4f1_longitudinal_bath_spatial_ward.json"))
          assert d["classification"]=="GE19_H4F1_LONGITUDINAL_BATH_WARD_COVARIANCE_DERIVED"
          assert d["all_subset_gates_pass"] is True
          assert all(v["exact"] for v in d["frozen_source_blobs"].values())
          assert all(d["frozen_covariant_action_bindings"].values())
          assert all(d["exact_reduced_bath_ward"]["gates"].values())
          assert d["exact_reduced_bath_ward"]["gates"]["full_GE05_node_lag_spatial_density"] is True
          assert d["full_all_sector_mixed_H4_Noether_derived"] is False
          assert d["H4_Z21_solve_performed"] is False
          assert d["Z21_certified"] is False
          assert d["lensing_licensed"] is False
          print("GE19_H4F1_LONGITUDINAL_BATH_WARD_AUDIT_PASS")
          PY
          sha256sum results/ge19_h4f1_longitudinal_bath_spatial_ward.json
          wc -c results/ge19_h4f1_longitudinal_bath_spatial_ward.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge19_h4f1_longitudinal_bath_spatial_ward
          path: |
            results/ge19_h4f1_longitudinal_bath_spatial_ward.json
            results/ge19_h4f1_longitudinal_bath_spatial_ward_FULL.log
          retention-days: 90
