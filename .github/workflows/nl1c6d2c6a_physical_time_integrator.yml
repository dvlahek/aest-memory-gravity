name: NL1C6D2C6A physical-time scalar-current integrator

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c6a_physical_time_integrator.yml'
      - 'nl1c6d2c6a/**'
      - 'docs/nl1c6d2c6a_*'

permissions:
  contents: read

concurrency:
  group: nl1c6d2c6a-physical-time-integrator
  cancel-in-progress: false

jobs:
  physical-time-integrator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated corrected CLASS
        run: bash nl1c6d2n/setup_corrected_class_local.sh

      - name: Run physical-time nonlinear scalar-current integrator
        run: bash nl1c6d2c6a/run_local.sh

      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2C6A physical-time scalar-current integrator' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c6a_physical_time_scalar_current_integrator.log ]]; then
            grep -E '^(I[1-8]_|CLASSIFICATION=|D2C6B_)' results/nl1c6d2c6a_physical_time_scalar_current_integrator.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
