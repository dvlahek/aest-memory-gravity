name: v050 locked global nonlinear refit certification

on:
  workflow_dispatch:
  push:
    paths:
      - 'v050/**'
      - '.github/workflows/v050-global-refit-certification.yml'

jobs:
  refit-member:
    strategy:
      fail-fast: false
      matrix:
        start: [canonical, plus, minus, cross]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v050
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v050/output
          python3 v019/apply_patch_v019.py class_v050
          python3 v019i/apply_ic_patch.py class_v050
          python3 v019j/apply_memory_patch.py class_v050
          python3 v019w/apply_variational_forcing_patch.py class_v050
          python3 v019y/apply_output_precision_patch.py class_v050
          python3 v023/apply_source_grid_trace_patch.py class_v050
      - name: Build CLASS
        run: make -C class_v050 -j2 class
      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v050/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v050/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v050/include/common.h
      - name: Run deterministic LM refit
        shell: bash
        run: |
          set -euo pipefail
          python3 v050/refit_lm_multistart.py class_v050 --kb 0.0665 --start '${{ matrix.start }}' --iters 18 --json-out 'results/v050_${{ matrix.start }}.json'
      - name: Upload member result
        uses: actions/upload-artifact@v4
        with:
          name: v050_member_${{ matrix.start }}
          path: results/v050_${{ matrix.start }}.json
      - name: Upload member debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v050_debug_${{ matrix.start }}
          path: |
            results/*.json
            results/*.log

  certify:
    needs: refit-member
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Download all member results
        uses: actions/download-artifact@v4
        with:
          pattern: v050_member_*
          path: results
          merge-multiple: true
      - name: Require all four member results
        shell: bash
        run: |
          set -euo pipefail
          test -s results/v050_canonical.json
          test -s results/v050_plus.json
          test -s results/v050_minus.json
          test -s results/v050_cross.json
      - name: Locked global certification
        shell: bash
        run: |
          set -euo pipefail
          python3 v050/certify_lm_multistart.py \
            results/v050_canonical.json results/v050_plus.json results/v050_minus.json results/v050_cross.json \
            --json-out results/v050_certification.json
      - name: Upload v0.50 certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v050
          path: results/*.json
