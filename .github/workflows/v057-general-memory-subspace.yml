name: v057 general positive-memory CMB subspace certification

on:
  workflow_dispatch:
  push:
    branches: [v057-general-memory-subspace]
    paths:
      - 'v057/**'
      - '.github/workflows/v057-general-memory-subspace.yml'

jobs:
  subspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v057
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply unchanged validated AeST patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v057/output
          python3 v019/apply_patch_v019.py class_v057
          python3 v019i/apply_ic_patch.py class_v057
          python3 v019j/apply_memory_patch.py class_v057
          python3 v019w/apply_variational_forcing_patch.py class_v057
          python3 v019y/apply_output_precision_patch.py class_v057
          python3 v023/apply_source_grid_trace_patch.py class_v057
      - name: Build CLASS
        run: make -C class_v057 -j2 class
      - name: Protocol and strict-accuracy audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool v057/predeclared_subspace_protocol.json >/dev/null
          grep -q 'V057_PREDECLARED_GENERAL_MEMORY_SUBSPACE_PROTOCOL' v057/predeclared_subspace_protocol.json
          grep -q 'tol_perturb_integration = 5.e-8' v047/p3.pre
          grep -q 'perturb_sampling_stepsize = 0.0025' v047/p3.pre
          grep -q '#define _OUTPUTPRECISION_ 17' class_v057/include/common.h
      - name: Prepare frozen tau basis and D5 nuisance stencil
        shell: bash
        run: |
          set -euo pipefail
          for t in 0.01 0.03 0.1 0.3 1 3 10 30 100; do python3 v039/prepare_locked_tau_case.py class_v057 --tauH0 "$t" --meta "results/v057_tau_${t}.json" >/dev/null; done
          python3 v046/prepare_fivepoint_cases.py class_v057 --meta results/v057_nuisance_meta.json >/dev/null
      - name: Run common frozen base and accepted-grid trace
        shell: bash
        run: |
          set -euo pipefail
          (cd class_v057 && AEST_OFFLINE_TRACE_FILE="$GITHUB_WORKSPACE/results/v057_trace.dat" OMP_NUM_THREADS=1 ./class v039_kb0p0665_tau10_base.ini ../v047/p3.pre) > results/v057_base.log 2>&1
          test -s results/v057_trace.dat
      - name: Build nine positive relaxation forcings
        shell: bash
        run: |
          set -euo pipefail
          for t in 0.01 0.03 0.1 0.3 1 3 10 30 100; do
            tag=$(printf '%s' "$t" | sed 's/\./p/g')
            python3 v039/build_tau_forcing.py results/v057_trace.dat --KB 0.0665 --tauH0 "$t" --out-prefix "results/v057_tau${tag}" --control-order 512 --primary-order 1024 --summary "results/v057_forcing_tau${tag}.json"
          done
      - name: Run nine centered memory tangents
        shell: bash
        run: |
          set -euo pipefail
          for t in 0.01 0.03 0.1 0.3 1 3 10 30 100; do
            tag=$(printf '%s' "$t" | sed 's/\./p/g')
            FORCE="$GITHUB_WORKSPACE/results/v057_tau${tag}_force.dat"
            (cd class_v057 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA=10 OMP_NUM_THREADS=1 ./class "v039_kb0p0665_tau${tag}_l10_p.ini" ../v047/p3.pre) > "results/v057_tau${tag}_p.log" 2>&1 & a=$!
            (cd class_v057 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA=-10 OMP_NUM_THREADS=1 ./class "v039_kb0p0665_tau${tag}_l10_m.ini" ../v047/p3.pre) > "results/v057_tau${tag}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done
      - name: Run frozen D5 nuisance stencil
        shell: bash
        run: |
          set -euo pipefail
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            for s in m2 m1 p1 p2; do
              (cd class_v057 && OMP_NUM_THREADS=1 ./class "v046_kb0p0665_tau10_p0_nuis_${q}_${s}.ini" ../v047/p3.pre) > "results/v057_${q}_${s}.log" 2>&1
            done
          done
      - name: Analyse projected general-memory subspace
        run: python3 v057/analyse_general_memory_subspace.py class_v057/output --json-out results/v057_general_memory_subspace.json
      - name: Upload v0.57 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v057
          path: |
            results/v057_general_memory_subspace.json
            results/v057_forcing_*.json
            results/v057_nuisance_meta.json
            v057/predeclared_subspace_protocol.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v057_debug
          path: |
            results/*.json
            results/*.log
