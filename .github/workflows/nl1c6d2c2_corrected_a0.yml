name: NL1C6D2C2 corrected covariant A0

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c2_corrected_a0.yml'
      - 'nl1c6d2c2/**'
      - 'docs/nl1c6d2c2_*'
      - 'nl1c6d1/longitudinal_weakfield_reduction_audit.py'
      - 'v019/apply_patch_v019.py'
      - 'v019/patch/source/aest_memory.c'

permissions:
  contents: read

concurrency:
  group: nl1c6d2c2-corrected-a0
  cancel-in-progress: false

jobs:
  structural-a0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Run preregistered corrected A0 audit
        run: bash nl1c6d2c2/run_a0_local.sh
      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2C2 corrected covariant A0' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c2_corrected_covariant_a0_structural_audit.log ]]; then
            grep -E '^(A0_|CLASSIFICATION=|D2C2_A1_LICENSED=)' results/nl1c6d2c2_corrected_covariant_a0_structural_audit.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
