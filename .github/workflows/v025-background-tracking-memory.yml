name: v025 Exp background-tracking memory timescale gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'v025/**'
      - '.github/workflows/v025-background-tracking-memory.yml'

jobs:
  tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v025

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy

      - name: Apply validated AeST and accepted-grid trace patches
        run: |
          mkdir -p results class_v025/output
          python3 v019/apply_patch_v019.py class_v025
          python3 v019i/apply_ic_patch.py class_v025
          python3 v019j/apply_memory_patch.py class_v025
          python3 v019w/apply_variational_forcing_patch.py class_v025
          python3 v019y/apply_output_precision_patch.py class_v025
          python3 v023/apply_source_grid_trace_patch.py class_v025
          python3 v025/prepare_v025_ini.py class_v025 --meta results/v025_meta.json

      - name: Build CLASS
        run: make -C class_v025 -j2 class

      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v025/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v025/source/perturbations.c
          grep -q 'E_rhs_aest -= 0.5\*Q_aest\*Bchi_aest' class_v025/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v025/include/common.h

      - name: Trace accepted eta0 source grid and baseline CMB
        shell: bash
        run: |
          set -euo pipefail
          (cd class_v025 && AEST_OFFLINE_TRACE_FILE="$GITHUB_WORKSPACE/results/v025_eta0_state_raw.dat" OMP_NUM_THREADS=1 ./class v025_base.ini ../v019p/pre/p3.pre) > results/v025_base.log 2>&1
          test -s results/v025_eta0_state_raw.dat
          echo "trace rows: $(wc -l < results/v025_eta0_state_raw.dat)"

      - name: Build p=0,0.5,1 positive Drude forcing
        run: |
          python3 v025/build_tracking_forcing.py results/v025_eta0_state_raw.dat --out-dir results --tau0H0 1 \
            --control-order 512 --primary-order 1024 --summary results/v025_tracking_forcing_summary.json

      - name: Run six core-LambdaCDM nuisance directions once
        shell: bash
        run: |
          set -euo pipefail
          for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
            (cd class_v025 && OMP_NUM_THREADS=1 ./class "v025_nuis_${q}_p.ini" ../v019p/pre/p3.pre) > "results/v025_nuis_${q}_p.log" 2>&1 & a=$!
            (cd class_v025 && OMP_NUM_THREADS=1 ./class "v025_nuis_${q}_m.ini" ../v019p/pre/p3.pre) > "results/v025_nuis_${q}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          done

      - name: Run adaptive lambda response ladders
        shell: bash
        run: |
          set -euo pipefail
          run_pair () {
            tag="$1"; L="$2"; FORCE="$GITHUB_WORKSPACE/results/v025_${tag}_force.dat"
            (cd class_v025 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="$L" OMP_NUM_THREADS=1 ./class "v025_${tag}_l${L}_p.ini" ../v019p/pre/p3.pre) > "results/v025_${tag}_l${L}_p.log" 2>&1 & a=$!
            (cd class_v025 && AEST_TANGENT_FORCE_FILE="$FORCE" AEST_TANGENT_LAMBDA="-$L" OMP_NUM_THREADS=1 ./class "v025_${tag}_l${L}_m.ini" ../v019p/pre/p3.pre) > "results/v025_${tag}_l${L}_m.log" 2>&1 & b=$!
            wait $a; wait $b
          }
          for L in 100 300 1000; do run_pair p0 "$L"; done
          for tag in p05 p1; do
            for L in 1 3 10 30 100 300 1000; do run_pair "$tag" "$L"; done
          done

      - name: Analyse background-tracking points
        run: |
          python3 v025/analyse_tracking_point.py class_v025/output --tag p0 --p 0 --lambdas 100,300,1000 \
            --force-control results/v025_p0_force_control.dat --force-primary results/v025_p0_force.dat --json-out results/v025_p0_analysis.json
          python3 v025/analyse_tracking_point.py class_v025/output --tag p05 --p 0.5 --lambdas 1,3,10,30,100,300,1000 \
            --force-control results/v025_p05_force_control.dat --force-primary results/v025_p05_force.dat --json-out results/v025_p05_analysis.json
          python3 v025/analyse_tracking_point.py class_v025/output --tag p1 --p 1 --lambdas 1,3,10,30,100,300,1000 \
            --force-control results/v025_p1_force_control.dat --force-primary results/v025_p1_force.dat --json-out results/v025_p1_analysis.json

      - name: Finalize tracking gate
        run: python3 v025/finalize_v025.py results --json-out results/v025_tracking_sweep.json --csv-out results/v025_tracking_sweep.csv

      - name: Upload v0.25 results
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v025_background_tracking
          path: |
            results/v025_tracking_sweep.json
            results/v025_tracking_sweep.csv
            results/v025_tracking_forcing_summary.json
            results/v025_*_analysis.json
            results/v025_meta.json
            results/v023_trace_patch.json

      - name: Upload v0.25 debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v025_debug
          path: |
            results/*.json
            results/*.log
