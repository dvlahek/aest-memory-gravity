name: NL1C7B4 Repair03 constraint source localization

on:
  push:
    branches: [nl1c7b-eta0-spherical-evolution]
    paths:
      - '.github/workflows/nl1c7b4-repair03-source-localization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy sympy

      - name: Verify frozen Repair03 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6d0ac30a1e2b16ed5b3c896c1a6411402ee5517e HEAD
          git merge-base --is-ancestor 3b6f19752792b4e04ea8c5ef4e6edef712d2f139 HEAD
          git merge-base --is-ancestor 561241a18cb7eea8ef7b842da665dd60789cf4b0 HEAD
          git merge-base --is-ancestor 20fa8d2c6e709cc70488d228d1dec086e21d073c HEAD
          git merge-base --is-ancestor 9c1f5c6a17467467bcf82e134f21793a3f63d0d4 HEAD
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification_repair03.py)" = "3c60d384de2a55b7b9f02ef48ec3eca1ce43be2f"
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification_repair03_runner.py)" = "f30a88a1cb04fda1c9126e8700287d72654f193f"
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification.py)" = "8559120dc273be3174eca130ca313ed6ff5acb25"
          test "$(git rev-parse HEAD:nl1c7b/initial_constraint_certification_repair01.py)" = "253a0ae2a19a597f06358704ea276c9005973af3"
          for spec in \
            '10495377062 sha256:f74795d3c57ba6f307655b1ec15513b57babc7eadbe0c81c4f62bf1949643d49' \
            '10481526695 sha256:c2ede2e602e35bbd52afdc0a5eee22cb1bf5c6efc2e1063bf8f2b91a0554fb6c' \
            '10469031693 sha256:193325536405f9a21a238f5fbe71a772d2484a096dcbfec3d6007e825cc38f70'; do
              set -- ${spec}; id="$1"; dig="$2"
              j="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/${id}")"
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["digest"]==sys.argv[1]; assert d["expired"] is False' "${dig}" <<<"${j}"
          done
          echo NL1C7B4_REPAIR03_PROVENANCE_PASS

      - name: Download exact retained C7A inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/final input/dense results
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10481526695/zip -o input/final.zip
          unzip -q input/final.zip -d input/final
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10469031693/zip -o input/dense.zip
          unzip -q input/dense.zip -d input/dense
          test -s input/final/nl1c7a_repair01_evalfix_primary_states.npz
          test -s input/dense/nl1c7a_repair01_dense_trace.dat
          test -s input/dense/nl1c7a_repair01_dense_coverage.json

      - name: Execute frozen Repair03 localization
        shell: bash
        run: |
          set +e
          set -uo pipefail
          PYTHONPATH="$PWD" python3 nl1c7b/initial_constraint_certification_repair03_runner.py \
            --trace input/dense/nl1c7a_repair01_dense_trace.dat \
            --coverage-json input/dense/nl1c7a_repair01_dense_coverage.json \
            --official-npz input/final/nl1c7a_repair01_evalfix_primary_states.npz \
            --out results/nl1c7b4_repair03_source_localization.json \
            2>&1 | tee results/nl1c7b4_repair03_source_localization.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "SCIENCE_RC=${rc}"
          test "${rc}" -eq 0 -o "${rc}" -eq 2

      - name: Verify diagnostic classification integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c7b4_repair03_source_localization.json'))
          allowed={
            'NL1C7B4_REPAIR03_CONSTRAINT_SOURCE_LOCALIZATION_COMPLETE',
            'NL1C7B4_REPAIR03_LOCALIZATION_IMPLEMENTATION_FAIL',
          }
          assert d['classification'] in allowed
          assert d['state_reproduction']['pass'] is True
          assert d['symbolic_K_dictionary_identity'] is True
          assert d['summary']['n_rows']==162
          assert d['summary']['n_baseline_cases']==54
          assert d['summary']['n_scaling_cases']==54
          assert d['claim_boundary']['state_projected'] is False
          assert d['claim_boundary']['dust_sign_changed'] is False
          assert d['claim_boundary']['radial_standard_species_added'] is False
          print(d['classification'])
          print(json.dumps(d['summary'],sort_keys=True))
          PY

      - name: Upload Repair03 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c7b4_repair03_source_localization
          path: |
            results/nl1c7b4_repair03_source_localization.json
            results/nl1c7b4_repair03_source_localization.log
          if-no-files-found: error
