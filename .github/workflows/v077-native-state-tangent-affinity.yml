name: v077 native-state tangent-affinity audit

on:
  workflow_dispatch:
  push:
    branches: [v053-model-freeze-planck]
    paths:
      - 'v077/**'
      - '.github/workflows/v077-native-state-tangent-affinity.yml'

jobs:
  native-state-tangent-affinity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4

      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v077

      - name: Install Python build dependencies
        run: python3 -m pip install --user numpy scipy cython setuptools wheel

      - name: Apply unchanged validated AeST patches
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_v077
          python3 v019i/apply_ic_patch.py class_v077
          python3 v019j/apply_memory_patch.py class_v077
          python3 v019w/apply_variational_forcing_patch.py class_v077
          python3 v019y/apply_output_precision_patch.py class_v077
          python3 v023/apply_source_grid_trace_patch.py class_v077
          python3 tools/apply_v072_offline_trace_runtime_reload_patch.py class_v077
          python3 tools/apply_v063_classy_runtime_reload_patch.py class_v077
          python3 tools/apply_v075_force_path_reload_patch.py class_v077

      - name: Build CLASS executable
        run: make -C class_v077 -j2 class

      - name: Build and install patched classy
        run: make -C class_v077 -j2 classy

      - name: Predata audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -m py_compile v077/native_state_tangent_affinity.py
          python3 - <<'PY'
          import json
          d=json.load(open('v077/predata_native_state_tangent_affinity.json'))
          assert d['classification']=='V077_PREDATA_NATIVE_STATE_TANGENT_AFFINITY_AUDIT'
          assert d['created_before_v077_result'] is True
          assert d['uses_observational_data'] is False
          assert d['result_informed_followup'] is True
          assert d['historical_classifications_must_remain_unchanged'] is True
          assert d['source_results']['v075_classification']=='V075_FOURIER_K_RESOLUTION_CLOSURE_FAIL'
          assert d['source_results']['v076_classification']=='V076_NATIVE_NODE_POWER_CLOSURE_FAIL'
          m=d['frozen_physical_model']
          assert m['KB']==0.0665
          assert m['tauH0']==10.0
          assert m['p']==0.0
          assert m['CLASS_commit']=='e85808324f51fc694d12e3ed7439552a3c3f9540'
          assert m['tangent_amplitudes']==[10.0,5.0,2.5,1.25]
          n=d['numerical_configuration']
          assert n['k_per_decade_for_pk']==80.0
          assert n['k_per_decade_for_bao']==560.0
          assert n['P_k_max_h_per_Mpc']==2.0
          assert n['z_max_pk']==5.0
          w=d['primary_native_window']
          assert w['k_h_per_Mpc_min']==0.03
          assert w['k_h_per_Mpc_max']==0.20
          assert w['z_min']==0.2
          assert w['z_max']==1.5
          o=d['primary_state_observable']
          assert o['field']=='CLASS native total-matter transfer source d_m'
          assert o['local_fractional_division_used'] is False
          g=d['primary_numerical_gates']
          assert g['forcing_control_vs_primary_relative_L2_max']==0.01
          assert g['forcing_control_vs_primary_cosine_min']==0.9999
          assert g['all_native_state_values_finite'] is True
          assert g['native_k_grid_relative_mismatch_max']==1e-12
          assert g['native_z_grid_absolute_mismatch_max']==1e-12
          assert g['native_state_tangent_lambda_affinity_global_normalized_RMS_max']==0.005
          assert g['native_state_even_residual_global_normalized_RMS_max']==0.005
          print('V077_PREDATA_NATIVE_STATE_TANGENT_AFFINITY_AUDIT_PASS')
          PY

      - name: Run native-state tangent-affinity audit
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^lensing = yes$/lensing = no/' v019/ini/aest_exp.ini
          python3 v077/native_state_tangent_affinity.py \
            --class-root class_v077 \
            --json-out results/v077_native_state_tangent_affinity.json \
            --npz-out results/v077_native_state_tangent_affinity.npz

      - name: Upload v0.77 theory bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v077_native_state_tangent_affinity
          path: |
            results/v077_native_state_tangent_affinity.json
            results/v077_native_state_tangent_affinity.npz
            results/v075_r4_forcing_summary.json
            results/v075_r4_forcing_trace.log
            results/v075_r4_forcing_trace.dat
            results/v075_r4_forcing_force.dat
            results/v076_v077_*_trace.dat
            results/v072_trace_reload_patch.json
            results/v075_force_path_reload_patch.json
          if-no-files-found: warn
