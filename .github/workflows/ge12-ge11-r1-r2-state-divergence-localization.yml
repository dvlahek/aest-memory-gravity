name: GE12 GE11 R1 R2 state divergence localization

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge12/**'
      - 'docs/ge12_ge11_r1_r2_state_divergence_localization_implementation_lock.md'
      - '.github/workflows/ge12-ge11-r1-r2-state-divergence-localization.yml'

jobs:
  state-divergence-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ge12/predata_ge11_r1_r2_state_divergence_localization.json)" = "0c3fbc8b8c7c229f9b8a1232e9824151990f11ee"
          test "$(git rev-parse HEAD:ge12/ge11_r1_r2_state_divergence_localization.py)" = "24f387ca6922d52159e361a1bdc372e2076eb952"
          test "$(git rev-parse HEAD:docs/ge12_ge11_r1_r2_state_divergence_localization_implementation_lock.md)" = "f2076252d73c4fd1396763dff15a87b74790b89a"
          git merge-base --is-ancestor 6424b782631fb923623dac0ed85019534a5245a7 HEAD
          git merge-base --is-ancestor 51ec675013c66296c2c3990494d2c928dd033207 HEAD
          git merge-base --is-ancestor 7511f5cb332f8df40a0cf0730af83fc1c8c7980e HEAD
          echo GE12_LOCK_PASS

      - name: Install dependencies
        run: python3 -m pip install --user numpy scipy

      - name: Verify frozen parent artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10600652596"             -o results/ge12_parent_artifact_metadata.json
          python3 - <<'PY'
          import json
          a=json.load(open('results/ge12_parent_artifact_metadata.json'))
          assert a['id']==10600652596
          assert a['workflow_run']['id']==35497478790
          assert a['digest']=='sha256:b35a3a0c8bbd22483bd04c006b20ceb97d3c7f263e178382026cba2983628ecc'
          assert a['expired'] is False
          print('GE12_PARENT_ARTIFACT_PASS')
          PY

      - name: Download frozen GE11 Repair01 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10600652596
          path: frozen_ge11
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35497478790

      - name: Predata implementation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ge12/ge11_r1_r2_state_divergence_localization.py
          python3 - <<'PY'
          import json
          d=json.load(open('ge12/predata_ge11_r1_r2_state_divergence_localization.json'))
          assert d['classification']=='GE12_PREDATA_GE11_R1_R2_STATE_DIVERGENCE_LOCALIZATION'
          assert d['uses_new_CLASS_run'] is False
          assert d['frozen_parent']['artifact_id']==10600652596
          assert d['frozen_representation']['common_nodes']==64
          assert d['gates']['reconstructed_parent_cross_jet_global_relative_L2_abs_error_max']==1e-12
          print('GE12_PREDATA_PASS')
          PY

      - name: Run GE12 localization
        shell: bash
        run: |
          set -euo pipefail
          python3 ge12/ge11_r1_r2_state_divergence_localization.py             --artifact-root frozen_ge11             --artifact-meta-json results/ge12_parent_artifact_metadata.json             --json-out results/ge12_ge11_r1_r2_state_divergence_localization.json             --npz-out results/ge12_ge11_r1_r2_state_divergence_localization.npz             | tee results/ge12_ge11_r1_r2_state_divergence_localization.log

      - name: Summarize GE12
        if: always()
        shell: bash
        run: |
          if test -s results/ge12_ge11_r1_r2_state_divergence_localization.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('results/ge12_ge11_r1_r2_state_divergence_localization.json'))
          print('CLASSIFICATION=',d['classification'])
          print('GATES=',d['gates'])
          print('PARENT=',d['parent'])
          print('TOP_CHANNELS=')
          for r in d['channels_ranked_by_global_relative_L2'][:12]:
              print(r)
          print('SCALE_FITS=')
          for k,v in d['least_squares_scale_fits'].items():
              print(k,v)
          print('PER_K=',d['per_k_global_relative_L2'])
          PY
          fi

      - name: Upload GE12 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_ge12_ge11_r1_r2_state_divergence_localization
          path: |
            results/ge12_parent_artifact_metadata.json
            results/ge12_ge11_r1_r2_state_divergence_localization.json
            results/ge12_ge11_r1_r2_state_divergence_localization.npz
            results/ge12_ge11_r1_r2_state_divergence_localization.log
            ge12/predata_ge11_r1_r2_state_divergence_localization.json
            docs/ge12_ge11_r1_r2_state_divergence_localization_implementation_lock.md
          if-no-files-found: warn
