name: C3 R6 frozen-metric reference repair

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c6c_r6_frozen_metric_reference.yml'
      - 'nl1c6d2c6c_r6/**'

concurrency:
  group: c3-r6-frozen-metric-reference
  cancel-in-progress: true

jobs:
  r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated zero-safe CLASS
        run: bash nl1c6d2c6c_r5/setup_zero_safe_class.sh

      - name: Build frozen-metric CLASS-variable tangent reference
        id: ref
        shell: bash
        run: |
          set +e
          source results/c3_r5_class_env.sh
          python -u nl1c6d2c6c_r6/build_frozen_metric_reference.py 2>&1 | tee results/c3_r6_reference.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate unchanged original C3 gate
        id: gate
        if: steps.ref.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          source results/c3_r5_class_env.sh
          python -u nl1c6d2c6c_r6/evaluate_r6_c3_gate.py 2>&1 | tee results/c3_r6_gate.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write R6 summary
        if: always()
        shell: bash
        run: |
          echo '## C3 R6 frozen-metric reference repair' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          for f in results/c3_r6_reference.log results/c3_r6_gate.log; do
            if [[ -f "$f" ]]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              grep -E '^(R5_FORCE_MODE|R6_MODE|R6_BACKGROUND|R6_C3|CLASSIFICATION=|FINITE_POSITIVE_ETA_NONLINEAR_MEMORY_LICENSED=|C3_R6_)' "$f" >> "$GITHUB_STEP_SUMMARY" || true
              echo '' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload R6 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3_r6_frozen_metric_reference
          path: |
            results/c3_r6*
          if-no-files-found: warn

      - name: Propagate scientific result
        if: always()
        shell: bash
        run: |
          r='${{ steps.ref.outputs.exit_code }}'
          g='${{ steps.gate.outputs.exit_code }}'
          echo "ref_exit=$r gate_exit=$g"
          if [[ "$r" != '0' ]]; then exit 12; fi
          if [[ "$g" != '0' ]]; then exit "$g"; fi
          exit 0
