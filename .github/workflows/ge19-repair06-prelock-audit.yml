name: GE19 Repair06 prelock canonical audit

on:
  workflow_dispatch:
  push:
    branches: [physics-first-gravitational-elasticity]
    paths:
      - 'ge19/repair06_*'
      - '.github/workflows/ge19-repair06-prelock-audit.yml'

jobs:
  prelock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install numpy scipy sympy

      - name: Compile Repair06
        run: python3 -m py_compile ge19/repair06_window_retarded_reduced_h3_z20_particular.py

      - name: Audit frozen physics and canonical realization
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, inspect, math
          from pathlib import Path
          import numpy as np

          root=Path.cwd()
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          r5=load(root/"ge19/repair05_window_retarded_reduced_h3_z20_particular.py","r5")
          r6=load(root/"ge19/repair06_window_retarded_reduced_h3_z20_particular.py","r6")

          # Frozen physical source/operator pieces are source-identical.
          frozen=[
              "build_stable_ge06_generator",
              "stable_exp_background_from_native",
              "reference_reduced_mode_state",
              "y2_source_from_reduced",
              "linear_operator_batch",
              "build_matrix",
          ]
          for name in frozen:
              assert inspect.getsource(getattr(r5,name))==inspect.getsource(getattr(r6,name)), name

          for name in [
              "KB","CV","K2","Q0","Z0","A0_MPC_INV","BETAS","C_TAGS","C_VALUES",
              "FOURIER_N","PHASES","M_SOLVE","NT_PRIMARY","NT_CONTROL",
              "NX_PRIMARY","NX_SPATIAL_CONTROL","SOURCE_SPATIAL_MAX",
              "LINEAR_RES_MAX","CONSTRAINT_MAX","TIME_STATE_MAX",
              "GE15_GE18_METRIC_MAX","GE18_NPZ_SHA"
          ]:
              a=getattr(r5,name); b=getattr(r6,name)
              if isinstance(a,np.ndarray): assert np.array_equal(a,b), name
              else: assert a==b, name

          g6=r6.load_frozen_generator(
              (root/"ge06/analytic_aest_directional_source_generator.py").resolve(),
              "r6_ge06"
          )
          m6=r6.build_stable_ge06_generator_v2(g6)
          assert m6.full_stable_z_audit["phi_t_dpt_exact_identity"], m6.full_stable_z_audit
          m7=r6.load_frozen_generator(
              (root/"ge07/pressureless_matter_directional_source_generator.py").resolve(),
              "r6_ge07"
          )

          # Physical-scale synthetic background, no local science parents.
          x=np.linspace(math.log(0.4),math.log(1/1.2),16)
          a=np.exp(x)
          H=np.full_like(x,1.0e-4)
          Z=np.linspace(4.45,4.68,len(x))
          bg={
              "x":x,"a":a,"H":H,
              "Q_action":r6.Q0+r6.Z0*Z,
              "Z_action":Z,
          }
          k=0.01
          q=np.asarray([2e-6,3e-6,-4e-7,5e-6],complex)
          v=np.asarray([1e-9,-2e-9,3e-10,-4e-9],complex)
          rhs=np.zeros(6,complex)

          y0,w0,idg=r6._initial_canonical_state(
              m6,m7,bg,"C_star",k,float(x[0]),q,v,rhs
          )
          M0,F0,ZY0,ZR0,WY0,WR0,C0,bp0,od0=r6._canonical_operator_matrices(
              m6,m7,bg,"C_star",k,float(x[0])
          )
          # Choose the synthetic anisotropy source consistently with the
          # prescribed initial q/v state; lapse and dust-density sources are
          # already zero by the initial algebraic solve.
          con0=np.zeros(2,complex)
          con0[1]=(C0[12]+C0[13])@w0
          src0=np.concatenate([rhs,con0])
          wrec=WY0@y0+WR0@src0
          zrec=wrec[r6._ZIDX]
          assert np.all(np.isfinite(y0))
          assert np.all(np.isfinite(M0))
          assert idg["initial_algebraic_scaled_residual"]<=1e-10, idg
          assert od0["algebraic_scaled_residual_max"]<=1e-10, od0
          assert od0["old_partition_noether_null_scaled_L2"]<=1e-8, od0
          assert np.max(np.abs(zrec[2:]-v))<=1e-10, (zrec,v)

          # The old p+lapse+density algebraic partition must exhibit the
          # expected Noether null, while the p+density+anisotropy partition
          # must be nonsingular and accurately solvable.
          stage_points=[]
          aug_cond=[]
          null_err=[]
          for i in range(len(x)-1):
              h=float(x[i+1]-x[i])
              stage_points += [float(x[i]+h/3.0), float(x[i+1])]
          for xx in stage_points:
              Cx,bpx,bdx=r6._local_linear_matrix(m6,m7,bg,"C_star",k,xx)
              # pphi principal row is analytically proportional to
              # (1+2 Z^2) exp(Z^2) and must never collapse to zero.
              pphi_principal=float(np.max(np.abs(Cx[2,r6._ZIDX])))
              assert np.isfinite(pphi_principal) and pphi_principal>0.0, (xx,pphi_principal)
              old=Cx[0:6][:,r6._ZIDX]
              n=np.asarray([
                  1.0,0.0,bpx["a"]*bpx["H"],
                  -1j*k/bpx["a"],bpx["Q_action"],1.0
              ],complex)
              rows=np.max(np.abs(old),axis=1)
              null_err.append(float(np.linalg.norm((old@n)/np.maximum(rows,1e-300))))

              aug=np.vstack([
                  Cx[0:4],Cx[5:6],Cx[12:13]+Cx[13:14]
              ])[:,r6._ZIDX]
              row=np.max(np.abs(aug),axis=1)
              Dr=1.0/row
              ar=Dr[:,None]*aug
              col=np.max(np.abs(ar),axis=0)
              asc=ar*(1.0/col)[None,:]
              aug_cond.append(float(np.linalg.cond(asc)))
              assert np.all(np.isfinite(asc))
              assert np.linalg.matrix_rank(asc)==6

          assert max(null_err)<=1e-8, max(null_err)
          assert np.all(np.isfinite(aug_cond)), aug_cond

          # Stable local linear representation with an 8-component source.
          M,F,ZY,ZR,WY,WR,C,bp,od=r6._canonical_operator_matrices(
              m6,m7,bg,"C_star",k,float(x[5])
          )
          y=np.asarray([1,2,3,4,5,6,7,8],complex)*1e-8
          rtest=np.asarray([1,-2,3,-4,5,-6,7,-8],complex)*1e-12
          fy=M@y+F@rtest
          w=WY@y+WR@rtest
          Calg=np.vstack([C[0:4],C[5:6],C[12:13]+C[13:14]])
          target=np.concatenate([y[4:8],[rtest[5],rtest[7]]])
          rows=np.max(np.abs(Calg),axis=1)
          linerr=np.linalg.norm((Calg@w-target)/rows)/max(
              np.linalg.norm((Calg@w)/rows),
              np.linalg.norm(target/rows),
              1e-300
          )
          assert linerr<=1e-10, (linerr,od)
          pL=C[14]@w; pR=C[15]@w
          prat=abs(pR-2*pL)/max(abs(pR),2*abs(pL),1e-300)
          assert prat<=1e-12, prat
          assert np.all(np.isfinite(fy))

          # Zero state / zero source must remain zero under the Radau march.
          zfun,cfun=r6._zero_source_interp(1)
          Y,rdg=r6._radau2_integrate_canonical(
              m6,m7,bg,"C_star",k,np.zeros((8,1),complex),zfun,cfun
          )
          assert np.max(np.abs(Y))<=1e-20, np.max(np.abs(Y))
          assert rdg["radau_block_scaled_relative_L2_residual_max"]<=1e-10, rdg

          print("NOETHER_NULL_SCALED_L2_MAX =",max(null_err))
          print("AUGMENTED_ALGEBRAIC_SCALED_CONDITION_2_MAX =",max(aug_cond))
          # Stable Exp controls remain unchanged.
          benign=r6.ge06_stable_benign_equivalence(g6,m6)
          physical=r6.ge06_physical_parameter_probe(m6)
          assert benign["all_stable_outputs_finite"]
          assert benign["coeff1_source_global_relative_L2"]<=1e-10
          assert benign["coeff2_source_global_relative_L2"]<=1e-10
          assert physical["c1"]["all_partials_finite"]
          assert physical["c2"]["all_partials_finite"]

          print("CANONICAL_INITIAL_MAP =",idg)
          print("CANONICAL_OPERATOR_DIAGNOSTIC =",od0)
          print("CANONICAL_AFFINE_SCALED_RELATIVE_ERROR =",linerr)
          print("CANONICAL_PRT_RATIO_ERROR =",prat)
          print("RADAU_ZERO_DIAGNOSTIC =",rdg)
          print("BENIGN_EQUIVALENCE =",benign)
          print("PHYSICAL_PARAMETER_PROBE =",physical)
          print("GE19_REPAIR06_PRELOCK_AUDIT_PASS")
          PY
