name: v045 locked-model nuisance derivative convergence audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'v045/**'
      - '.github/workflows/v045-derivative-audit.yml'

jobs:
  derivative-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v045
      - name: Install numerical dependencies
        run: python3 -m pip install --user numpy scipy
      - name: Apply validated patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results class_v045/output
          python3 v019/apply_patch_v019.py class_v045
          python3 v019i/apply_ic_patch.py class_v045
          python3 v019j/apply_memory_patch.py class_v045
          python3 v019w/apply_variational_forcing_patch.py class_v045
          python3 v019y/apply_output_precision_patch.py class_v045
          python3 v023/apply_source_grid_trace_patch.py class_v045
      - name: Build CLASS
        run: make -C class_v045 -j2 class
      - name: Source audit
        run: |
          set -euo pipefail
          grep -q 'AeST v0.23 eta0 accepted source-grid trace' class_v045/source/aest_memory.c
          grep -q 'aest_tangent_external_force' class_v045/source/perturbations.c
          grep -q '#define _OUTPUTPRECISION_ 17' class_v045/include/common.h
      - name: Prepare derivative audit cases
        run: python3 v045/prepare_derivative_audit.py class_v045 --meta results/v045_meta.json
      - name: Run locked base
        shell: bash
        run: |
          set -euo pipefail
          PRE='../v019p/pre/p2.pre'
          (cd class_v045 && OMP_NUM_THREADS=1 ./class 'v045_kb0p0665_tau10_p0_s1_base.ini' "$PRE") > results/v045_base.log 2>&1
      - name: Run all nuisance derivative pairs
        shell: bash
        run: |
          set -euo pipefail
          PRE='../v019p/pre/p2.pre'
          for SCALE in 0.25 0.5 1.0 1.5 2.0; do
            TAG=$(python3 -c "x=float('$SCALE'); print('kb0p0665_tau10_p0_s'+('%.6g'%x).replace('.','p').replace('-','m'))")
            for q in H0 omega_b omega_cdm tau_reio n_s lnA_s; do
              (cd class_v045 && OMP_NUM_THREADS=1 ./class "v045_${TAG}_nuis_${q}_p.ini" "$PRE") > "results/v045_${SCALE}_nuis_${q}_p.log" 2>&1 & a=$!
              (cd class_v045 && OMP_NUM_THREADS=1 ./class "v045_${TAG}_nuis_${q}_m.ini" "$PRE") > "results/v045_${SCALE}_nuis_${q}_m.log" 2>&1 & b=$!
              wait $a; wait $b
            done
          done
      - name: Analyse per-parameter derivative convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 v045/analyse_derivative_audit.py class_v045/output --json-out results/v045_derivative_audit.json
      - name: Locked certification gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('results/v045_derivative_audit.json'))
          assert q['gates']['all_parameters_fine_step_stable']
          assert not q['offending_parameters']
          print({'classification':q['classification'],'offenders':q['offending_parameters']})
          PY
      - name: Upload v0.45 result
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v045
          path: |
            results/v045_derivative_audit.json
            results/v045_meta.json
      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v045_debug
          path: |
            results/*.json
            results/*.log
