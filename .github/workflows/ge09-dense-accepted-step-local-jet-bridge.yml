name: GE09 dense accepted step local jet bridge

on:
  workflow_dispatch:

jobs:
  dense-local-jet:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ge09/predata_dense_accepted_step_local_jet_bridge.json)" = "239a0296a25b3740e67c02759c1998560c37de4f"
          test "$(git rev-parse HEAD:ge09/apply_dense_accepted_step_trace_patch.py)" = "23b0cd22ebab499aee0ce03e6b3b678fe727ef55"
          test "$(git rev-parse HEAD:ge09/dense_accepted_step_local_jet_bridge.py)" = "f34b54d74bd4d913fdb6e61cd47903b1ddffe87f"
          test "$(git rev-parse HEAD:docs/ge09_preexecution_precision_injection_correction.md)" = "e39e3f4f563521ef780e7799bb93fc8354a55a25"
          test "$(git rev-parse HEAD:docs/ge09_dense_accepted_step_local_jet_bridge_implementation_lock_v2.md)" = "66f728ce55e585a9dc61e7b659dfe5687c5d1383"
          git merge-base --is-ancestor 823ffd1a9da8e103e4568044f0f3ceb29c374aac HEAD
          git merge-base --is-ancestor 9dbda17590c99b5880ef94da149053cdbf038e15 HEAD
          git merge-base --is-ancestor 068b35d4f26caef07938b6177fc05458063367e5 HEAD
          git merge-base --is-ancestor 675da5b47499fb4d870d5bbc949a554cf53f292c HEAD
          git merge-base --is-ancestor 5bd5e5673eddd93333bf440973a4c3711b8a7030 HEAD
          echo GE09_LOCK_V2_PASS

      - name: Checkout pinned CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_ge09

      - name: Install Python build dependencies
        run: python3 -m pip install --user numpy scipy cython setuptools wheel

      - name: Apply validated AeST chain and diagnostic traces
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_ge09
          python3 v019i/apply_ic_patch.py class_ge09
          python3 v019j/apply_memory_patch.py class_ge09
          python3 v019w/apply_variational_forcing_patch.py class_ge09
          python3 v019y/apply_output_precision_patch.py class_ge09
          python3 v023/apply_source_grid_trace_patch.py class_ge09
          python3 tools/apply_v072_offline_trace_runtime_reload_patch.py class_ge09
          python3 tools/apply_v063_classy_runtime_reload_patch.py class_ge09
          python3 ge08/apply_full_state_trace_patch.py class_ge09
          python3 ge09/apply_dense_accepted_step_trace_patch.py class_ge09

      - name: Build CLASS and classy
        shell: bash
        run: |
          set -euo pipefail
          make -C class_ge09 -j2 class
          make -C class_ge09 -j2 classy

      - name: Predata implementation audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -m py_compile ge09/apply_dense_accepted_step_trace_patch.py ge09/dense_accepted_step_local_jet_bridge.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('ge09/predata_dense_accepted_step_local_jet_bridge.json'))
          assert d['classification']=='GE09_PREDATA_DENSE_ACCEPTED_STEP_LOCAL_JET_BRIDGE'
          assert d['created_before_result'] is True
          assert d['uses_observational_data'] is False
          assert d['finite_physical_eta'] is False
          assert d['common_time_representation']['common_nodes']==64
          assert d['gates']['source_grid_state_validation_abs_or_rel_max']==1e-4
          assert d['gates']['primary_vs_decimated_control_global_relative_L2_max']==5e-4
          assert d['gates']['primary_vs_decimated_control_pointwise_abs_or_rel_max']==2e-3
          src=Path('ge09/dense_accepted_step_local_jet_bridge.py').read_text()
          assert 'pars["tol_perturb_integration"]=5e-8' in src
          assert 'pars["perturb_sampling_stepsize"]=0.0025' in src
          patch=json.load(open('results/ge09_dense_accepted_step_trace_patch.json'))
          assert patch['classification']=='GE09_DENSE_ACCEPTED_STEP_TRACE_PATCH_PASS'
          assert patch['physics_modified'] is False
          print('GE09_PREDATA_IMPLEMENTATION_PASS')
          PY

      - name: Run GE09 local jet bridge
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^lensing = yes$/lensing = no/' v019/ini/aest_exp.ini
          python3 ge09/dense_accepted_step_local_jet_bridge.py             --class-root class_ge09             --json-out results/ge09_dense_accepted_step_local_jet_bridge.json             --npz-out results/ge09_dense_accepted_step_local_jet_bridge.npz             | tee results/ge09_dense_accepted_step_local_jet_bridge.log

      - name: Summarize GE09
        if: always()
        shell: bash
        run: |
          if test -s results/ge09_dense_accepted_step_local_jet_bridge.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('results/ge09_dense_accepted_step_local_jet_bridge.json'))
          print('CLASSIFICATION=',d['classification'])
          print('TRACE=',d['trace'])
          print('SOURCE_GRID_VALIDATION=',d['source_grid_validation'])
          print('JET_CONTROL=',d['jet_control'])
          print('EXACT_CONTROLS=',d['exact_internal_controls'])
          print('GATES=',d['gates'])
          print('PROJECT_BOUNDARY=',d['project_boundary'])
          PY
          fi

      - name: Upload GE09 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_ge09_dense_accepted_step_local_jet_bridge
          path: |
            results/ge09_dense_accepted_step_local_jet_bridge.json
            results/ge09_dense_accepted_step_local_jet_bridge.npz
            results/ge09_dense_accepted_step_local_jet_bridge.log
            results/ge09_dense_accepted_step_trace.dat
            results/ge09_source_state_trace.dat
            results/ge09_dense_accepted_step_trace_patch.json
            ge09/predata_dense_accepted_step_local_jet_bridge.json
            docs/ge09_preexecution_precision_injection_correction.md
            docs/ge09_dense_accepted_step_local_jet_bridge_implementation_lock_v2.md
          if-no-files-found: warn
