name: NL1C7A A3-A4 native trace coverage

on:
  push:
    branches: [nl1c7a-growing-mode-bridge]
    paths:
      - '.github/workflows/nl1c7a-native-trace-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_c7a

      - name: Install build dependencies
        run: python3 -m pip install --user numpy scipy cython setuptools wheel

      - name: Verify frozen C7A Repair05 locks and A2 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5399a2ca73165e8f97cea45934e50baf8ffb3629 HEAD
          git merge-base --is-ancestor 1c5bec98bc713c809e265aee7c7c74690015550d HEAD
          git merge-base --is-ancestor cfdb171c376c0d4e7b72bec6a12af84d3e66954c HEAD
          git merge-base --is-ancestor 8f5ef128548e2f2fc3a77cf91f1594fffb412d93 HEAD
          git merge-base --is-ancestor 384a06e3090bfe69a4ed834291ca85ef76de79f3 HEAD
          git merge-base --is-ancestor 2e7092ba8a6c606f4406ace0a433b4549ada61c2 HEAD
          git merge-base --is-ancestor 4d178b30be47938297d405a5d1b8f4ba3d7f75ca HEAD
          test "$(git rev-parse HEAD:nl1c7a/apply_trace_extension.py)" = "21147e873e6cdee8b55260189eafb8c0e612f02b"
          test "$(git rev-parse HEAD:nl1c7a/trace_coverage_probe.py)" = "4d9b4b83ecdb144a7a853ae337f9c1136fd8fb07"
          run_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/runs/35092206904)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["conclusion"]=="success"; assert d["head_sha"]=="0ccd15c1a7b6660a72fa1c49e8e7317967443631"' <<<"${run_json}"
          art_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/dvlahek/aest-memory-gravity/actions/artifacts/10444488624)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["digest"]=="sha256:05b36f93e272aebf04f9887b384c695b01b399ca4e816b1549a8e5d7f8189422"; assert d["expired"] is False' <<<"${art_json}"
          echo NL1C7A_REPAIR05_LOCKS_AND_A2_PROVENANCE_PASS

      - name: Apply validated eta0 AeST stack
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_c7a
          python3 v019i/apply_ic_patch.py class_c7a
          python3 v019j/apply_memory_patch.py class_c7a
          python3 v019w/apply_variational_forcing_patch.py class_c7a
          python3 v019y/apply_output_precision_patch.py class_c7a
          python3 v023/apply_source_grid_trace_patch.py class_c7a
          python3 tools/apply_v072_offline_trace_runtime_reload_patch.py class_c7a
          python3 tools/apply_v063_classy_runtime_reload_patch.py class_c7a
          python3 tools/apply_v075_force_path_reload_patch.py class_c7a

      - name: Snapshot pre-extension source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/c7a_before
          cp class_c7a/include/aest_memory.h results/c7a_before/aest_memory.h
          cp class_c7a/source/aest_memory.c results/c7a_before/aest_memory.c
          cp class_c7a/source/perturbations.c results/c7a_before/perturbations.c

      - name: Apply locked output-only C7A trace extension Repair03
        run: python3 nl1c7a/apply_trace_extension.py class_c7a

      - name: Verify output-only source boundary Repair02
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,difflib
          b=Path('results/c7a_before/perturbations.c').read_text().splitlines()
          a=Path('class_c7a/source/perturbations.c').read_text().splitlines()
          bt='\n'.join(b); at='\n'.join(a)
          assert [x for x in b if 'dy[' in x] == [x for x in a if 'dy[' in x]
          critical=['E_rhs_aest -= 0.5*Q_aest*Bchi_aest','dy[pv->index_pt_E_aest]','dy[pv->index_pt_delta_cdm]','dy[pv->index_pt_theta_cdm]','dy[pv->index_pt_alpha_aest]']
          for token in critical:
              assert bt.count(token) >= 1, (token, bt.count(token))
              assert at.count(token) == bt.count(token), (token, bt.count(token), at.count(token))
          changed=[x for x in difflib.unified_diff(b,a,n=0) if (x.startswith('+') or x.startswith('-')) and not x.startswith('+++') and not x.startswith('---')]
          forbidden=['dy[','E_rhs_aest =','Pi_aest =','metric_euler=']
          assert not any(tok in line for line in changed for tok in forbidden), changed
          d=json.load(open('results/nl1c7a_trace_extension_patch.json'))
          assert d['classification']=='NL1C7A_OUTPUT_ONLY_TRACE_EXTENSION_REPAIR03'
          assert d['historical_technical_failure_runs']==[35092490498,35093456930,35093652714]
          assert all(d['checks'].values())
          print('NL1C7A_OUTPUT_ONLY_SOURCE_BOUNDARY_REPAIR03_PASS')
          PY

      - name: Apply Repair04 diagnostic k-output capacity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('class_c7a/include/perturbations.h')
          before=p.read_text()
          old='#define _MAX_NUMBER_OF_K_FILES_ 30'
          new='#define _MAX_NUMBER_OF_K_FILES_ 160'
          assert before.count(old)==1
          after=before.replace(old,new,1)
          assert after.count(new)==1 and old not in after
          b=before.splitlines(); a=after.splitlines()
          changed=[(x,y) for x,y in zip(b,a) if x!=y]
          assert changed==[(old,new)], changed
          p.write_text(after)
          report={
            'classification':'NL1C7A_DIAGNOSTIC_K_OUTPUT_CAPACITY_REPAIR04',
            'historical_technical_failure_run':35093879845,
            'old_capacity':30,'new_capacity':160,'requested_k_count':128,
            'physics_modified':False,'solver_tolerances_modified':False,
            'k_grid_modified':False,'science_gates_modified':False,
            'checks':{'single_macro_replacement':True,'capacity_exceeds_requested_grid':True,'only_header_line_changed':len(changed)==1},
          }
          Path('results').mkdir(exist_ok=True)
          Path('results/nl1c7a_k_output_capacity_repair04.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Build CLASS and classy
        run: |
          make -C class_c7a -j2 class
          make -C class_c7a -j2 classy

      - name: Run locked A4 native coverage probe Repair05
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=1
          python3 nl1c7a/trace_coverage_probe.py \
            --class-root class_c7a \
            --trace-out results/nl1c7a_extended_source_trace.dat \
            --json-out results/nl1c7a_trace_coverage.json \
            2>&1 | tee results/nl1c7a_trace_coverage.log

      - name: Verify A4 classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/nl1c7a_trace_coverage.json'))
          assert d['classification']=='NL1C7A_NATIVE_TRACE_COVERAGE_PASS'
          assert all(d['gates'].values())
          assert len(d['k_grid_h_Mpc'])==128
          assert d['repair05']['diagnostic_batching_only'] is True
          assert d['repair05']['batch_size']==24
          assert d['repair05']['n_batches']==6
          assert d['repair05']['interpolation_used'] is False
          assert d['repair05']['nearest_neighbour_substitution_used'] is False
          assert all(b['requested_k_relative_miss_max']<=1e-12 for b in d['repair05']['batches'])
          r=json.load(open('results/nl1c7a_k_output_capacity_repair04.json'))
          assert r['classification']=='NL1C7A_DIAGNOSTIC_K_OUTPUT_CAPACITY_REPAIR04'
          assert all(r['checks'].values())
          print('NL1C7A_NATIVE_TRACE_COVERAGE_PASS')
          PY

      - name: Upload A3-A4 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_nl1c7a_native_trace_coverage
          path: |
            results/nl1c7a_trace_extension_patch.json
            results/nl1c7a_k_output_capacity_repair04.json
            results/nl1c7a_trace_coverage.json
            results/nl1c7a_trace_coverage.log
            results/nl1c7a_extended_source_trace.dat
          if-no-files-found: warn
