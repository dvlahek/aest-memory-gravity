name: NL1C6D2AC corrected matter audit

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2ac_corrected_matter_audit.yml'
      - 'nl1c6d2ac/**'
      - 'nl1c5bc/**'
      - 'nl1c6d2n/setup_corrected_class_local.sh'
      - 'v019/patch/source/aest_memory.c'
      - 'docs/nl1c6d2ac_*'

permissions:
  contents: read

concurrency:
  group: nl1c6d2ac-corrected-matter
  cancel-in-progress: false

jobs:
  matter-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy cython setuptools wheel

      - name: Build isolated corrected CLASS
        run: bash nl1c6d2n/setup_corrected_class_local.sh

      - name: Regenerate corrected source freeze
        run: bash nl1c5bc/run_local.sh

      - name: Run corrected D2A matter audit
        run: bash nl1c6d2ac/run_local.sh

      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2AC corrected matter audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2ac_corrected_baryon_matter_sector_audit.log ]]; then
            grep -E '^(A[1-4]_|CLASSIFICATION=)' results/nl1c6d2ac_corrected_baryon_matter_sector_audit.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
