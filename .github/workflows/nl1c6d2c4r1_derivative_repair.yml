name: NL1C6D2C4R1 derivative-control repair

on:
  workflow_dispatch:
  push:
    branches:
      - v053-exp-normalization-corrected
    paths:
      - '.github/workflows/nl1c6d2c4r1_derivative_repair.yml'
      - 'nl1c6d2c4r1/**'
      - 'docs/nl1c6d2c4r1_*'

permissions:
  contents: read

concurrency:
  group: nl1c6d2c4r1-derivative-repair
  cancel-in-progress: false

jobs:
  derivative-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout corrected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Run preregistered D2C4R1 repair audit
        run: bash nl1c6d2c4r1/run_local.sh
      - name: Write compact summary
        if: always()
        shell: bash
        run: |
          echo '## NL1C6D2C4R1 derivative-control repair' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/nl1c6d2c4r1_derivative_control_repair.log ]]; then
            grep -E '^(R1_|CLASSIFICATION=|ACTION_DERIVATION_)' results/nl1c6d2c4r1_derivative_control_repair.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
