name: v061 SPT-3G D1 frozen-model refit

on:
  workflow_dispatch:
  push:
    branches: [v053-model-freeze-planck]
    paths:
      - 'v061/**'
      - '.github/workflows/v061-spt3g-d1-refit.yml'

jobs:
  fit:
    strategy:
      fail-fast: false
      matrix:
        mode: [free, eta0]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout AeST harness
        uses: actions/checkout@v4
      - name: Checkout pinned official CLASS
        uses: actions/checkout@v4
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: class_v061
      - name: Checkout official SPT candl data
        uses: actions/checkout@v4
        with:
          repository: SouthPoleTelescope/spt_candl_data
          ref: efe35b7bfd815a115d5123e210a6849a4175bc81
          path: spt_candl_data_src
      - name: Install SPT likelihood dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user numpy scipy getdist 'candl-like==2.0.3'
          python3 -m pip install --user ./spt_candl_data_src
          mkdir -p results class_v061/output
          python3 - <<'PY'
          import candl, spt_candl_data
          print('SPT shortcut:', spt_candl_data.SPT3G_D1_TnE_lite)
          L=candl.Like(spt_candl_data.SPT3G_D1_TnE_lite, feedback=True, data_selection=['ell<400 remove','ell>2500 remove'])
          print('SPT ell_max:',L.ell_max)
          print('SPT nuisance:',L.required_nuisance_parameters)
          PY
      - name: Apply unchanged validated AeST patches
        shell: bash
        run: |
          set -euo pipefail
          python3 v019/apply_patch_v019.py class_v061
          python3 v019i/apply_ic_patch.py class_v061
          python3 v019j/apply_memory_patch.py class_v061
          python3 v019w/apply_variational_forcing_patch.py class_v061
          python3 v019y/apply_output_precision_patch.py class_v061
          python3 v023/apply_source_grid_trace_patch.py class_v061
      - name: Build CLASS
        run: make -C class_v061 -j2 class
      - name: Predata audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile v061/spt3g_d1_refit.py v061/compare_spt_refits.py
          python3 - <<'PY'
          import json
          d=json.load(open('v061/predata_spt3g_d1.json'))
          assert d['classification']=='V061_PREDATA_SPT3G_D1_DECLARATION'
          assert d['created_before_spt_eta_result'] is True
          assert d['frozen_model']['KB']==0.0665 and d['frozen_model']['tauH0']==10.0 and d['frozen_model']['lambda']==10.0
          assert d['inference']['eta_bounds']==[-40.0,40.0]
          assert '400<=ell<=2500' in d['multipole_policy']['analysis_selection']
          print('V061_PREDATA_AUDIT_PASS')
          PY
      - name: Run SPT-3G D1 refit
        shell: bash
        run: |
          set -euo pipefail
          python3 v061/spt3g_d1_refit.py --class-root class_v061 --mode '${{ matrix.mode }}' --json-out results/v061_spt_${{ matrix.mode }}.json
      - name: Upload SPT member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v061_spt_${{ matrix.mode }}
          path: |
            results/v061_spt_${{ matrix.mode }}.json
            results/v061_it*_forcing.json
            results/v061_*.log

  compare:
    needs: fit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download free member
        uses: actions/download-artifact@v4
        with:
          name: results_bundle_v061_spt_free
          path: gathered/free
      - name: Download eta0 member
        uses: actions/download-artifact@v4
        with:
          name: results_bundle_v061_spt_eta0
          path: gathered/eta0
      - name: Compare SPT refits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 v061/compare_spt_refits.py --free gathered/free/v061_spt_free.json --eta0 gathered/eta0/v061_spt_eta0.json --json-out results/v061_spt_comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: results_bundle_v061_spt_comparison
          path: results/v061_spt_comparison.json
